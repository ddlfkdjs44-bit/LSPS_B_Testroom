function renderWeek(weekStart,curMonth){
  const HEADER=isMobileCal()?20:26, BARH=isMobileCal()?29:22;
  const GAP=isMobileCal()?3:7; // CSS .week gap과 맞춰 바 위치 계산 (모바일에서 좁은 간격 반영)
  const wsNum=dayNum(ymd(weekStart)), weNum=wsNum+6;
  let segs=[];
  data.events.forEach(e=>{
    if(!passProj(e))return;
    const s=dayNum(e.date),en=dayNum(dueOf(e));
    if(en<wsNum||s>weNum)return;
    segs.push({e,startCol:Math.max(0,s-wsNum),endCol:Math.min(6,en-wsNum),contL:s<wsNum,contR:en>weNum});
  });
  segs.sort((a,b)=>a.startCol-b.startCol||(b.endCol-b.startCol)-(a.endCol-a.startCol)||a.e.date.localeCompare(b.e.date));
  const lanes=[];
  segs.forEach(sg=>{let placed=false;for(let i=0;i<lanes.length;i++){if(lanes[i].every(o=>sg.endCol<o.s||sg.startCol>o.e)){lanes[i].push({s:sg.startCol,e:sg.endCol});sg.lane=i;placed=true;break;}}if(!placed){sg.lane=lanes.length;lanes.push([{s:sg.startCol,e:sg.endCol}]);}});
  const shown=lanes.length; // 칸 수 제한 없이 겹치는 일정 전부 표시 (연속 기간을 한눈에 보기 위함)
  const h=Math.max(isMobileCal()?64:94,HEADER+shown*BARH+10);
  let cells='';
  for(let c=0;c<7;c++){
    const d=new Date(weekStart);d.setDate(weekStart.getDate()+c);
    const s=ymd(d),dow=d.getDay(),muted=d.getMonth()!==curMonth,isToday=s===TODAY_STR;
    const hol=HOLIDAYS[s];
    let dcls='';if(dow===0)dcls='sun';if(dow===6)dcls='sat';if(hol)dcls='hol';
    const holLbl=hol?`<span class="hol-lbl">${hol}</span>`:'';
    cells+=`<div class="cell ${muted?'muted':''} ${isToday?'today':''} ${hol?'holiday':''}" style="min-height:${h}px" onclick="newEvent('${s}')"><span class="dnum ${dcls}">${d.getDate()}</span>${isToday?'<span class="today-badge">오늘!</span>':''}${holLbl}</div>`;
  }
  let bars='';
  segs.forEach(sg=>{
    const n=sg.endCol-sg.startCol+1;
    const left=`calc((100% - ${6*GAP}px)/7 * ${sg.startCol} + ${sg.startCol*GAP}px)`;
    const width=`calc((100% - ${6*GAP}px)/7 * ${n} + ${(n-1)*GAP}px - 2px)`;
    const top=HEADER+sg.lane*BARH;
    const tot=(sg.e.todos||[]).length,done=(sg.e.todos||[]).filter(t=>t.status==='done').length;
    const allDone=tot>0&&done===tot;
    const bc=tot?`<span class="bc">${done}/${tot}</span>`:'';
    const cls=`ebar ${sg.contL?'contL':''} ${sg.contR?'contR':''} ${allDone?'alldone':''}`;
    const label=(sg.contL&&sg.startCol===0?'‹ ':'')+esc(sg.e.title||'(제목 없음)')+(sg.contR?' ›':'');
    bars+=`<div class="${cls}" style="left:${left};width:${width};top:${top}px;background:${projColor(sg.e.projectId)}" onclick="event.stopPropagation();openEvent('${sg.e.id}')">${bc}${label}</div>`;
  });
  return `<div class="week">${cells}<div class="bars">${bars}</div></div>`;
}
function shift(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);renderCal();}
function goToday(){view=new Date();renderCal();}
/* ── 캘린더 이미지(PNG) 저장 / 공유 : 화면을 그대로 캔버스에 그림 (외부 라이브러리 없음) ── */
function rrect(ctx,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fontOf(el,sizePx){const cs=getComputedStyle(el);return `${cs.fontStyle} ${cs.fontWeight} ${sizePx||parseFloat(cs.fontSize)+'px'} ${cs.fontFamily}`;}
function buildCalCanvasWide(){
  const y=view.getFullYear(), m=view.getMonth();
  const firstDow=new Date(y,m,1).getDay();
  let cursor=new Date(y,m,1); cursor.setDate(1-firstDow);
  const lastDay=new Date(y,m+1,0);
  const CELLW=176, GAP=8, HEADER=32, BARH=28;
  const weeks=[];
  while(cursor<=lastDay){
    const weekStart=new Date(cursor);
    const wsNum=dayNum(ymd(weekStart)), weNum=wsNum+6;
    const segs=[];
    data.events.forEach(e=>{
      if(!passProj(e))return;
      const s=dayNum(e.date), en=dayNum(dueOf(e));
      if(en<wsNum||s>weNum)return;
      segs.push({e,startCol:Math.max(0,s-wsNum),endCol:Math.min(6,en-wsNum),contL:s<wsNum,contR:en>weNum});
    });
    segs.sort((a,b)=>a.startCol-b.startCol||(b.endCol-b.startCol)-(a.endCol-a.startCol)||a.e.date.localeCompare(b.e.date));
    const lanes=[];
    segs.forEach(sg=>{let placed=false;for(let i=0;i<lanes.length;i++){if(lanes[i].every(o=>sg.endCol<o.s||sg.startCol>o.e)){lanes[i].push({s:sg.startCol,e:sg.endCol});sg.lane=i;placed=true;break;}}if(!placed){sg.lane=lanes.length;lanes.push([{s:sg.startCol,e:sg.endCol}]);}});
    const shown=lanes.length;
    const h=Math.max(78,HEADER+shown*BARH+10);
    weeks.push({weekStart,segs,h});
    cursor.setDate(cursor.getDate()+7);
  }
  const PAD=22, TITLEH=44, WKH=32;
  const totalW=CELLW*7+GAP*6;
  const totalH=weeks.reduce((a,w)=>a+w.h+GAP,0)-GAP;
  const scale=2;
  const cv=document.createElement('canvas');
  cv.width=Math.ceil((totalW+PAD*2)*scale);
  cv.height=Math.ceil((totalH+PAD*2+TITLEH+WKH)*scale);
  const ctx=cv.getContext('2d'); ctx.scale(scale,scale);
  const FONT="'Pretendard','Malgun Gothic',sans-serif";
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,totalW+PAD*2,totalH+PAD*2+TITLEH+WKH);

  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  ctx.fillStyle='#1a1a1a'; ctx.font=`700 26px ${FONT}`;
  ctx.fillText(`${m+1}월`, PAD, PAD+27);
  const moW=ctx.measureText(`${m+1}월`).width;
  ctx.fillStyle='#9aa0a6'; ctx.font=`15px 'IBM Plex Mono',monospace`;
  ctx.fillText(String(y), PAD+moW+9, PAD+27);

  ctx.textAlign='center';
  WD.forEach((w,i)=>{
    const cx=PAD+i*(CELLW+GAP)+CELLW/2;
    ctx.fillStyle= i===0?'#d2543a': i===6?'#0e6b73':'#666';
    ctx.font=`600 13px ${FONT}`;
    ctx.fillText(w, cx, PAD+TITLEH+21);
  });

  let y0=PAD+TITLEH+WKH;
  weeks.forEach(wk=>{
    for(let c=0;c<7;c++){
      const d=new Date(wk.weekStart); d.setDate(wk.weekStart.getDate()+c);
      const s=ymd(d), dow=d.getDay(), muted=d.getMonth()!==m, isToday=s===TODAY_STR;
      const hol=HOLIDAYS[s];
      const x=PAD+c*(CELLW+GAP), yy=y0;
      ctx.fillStyle= isToday? '#e8f4f3':'#fbfbfc';
      ctx.fillRect(x,yy,CELLW,wk.h);
      ctx.strokeStyle='#e6e6e6'; ctx.lineWidth=1; ctx.strokeRect(x+.5,yy+.5,CELLW-1,wk.h-1);
      ctx.textAlign='left';
      ctx.fillStyle = muted? '#c7cbd1' : (hol||dow===0? '#d2543a' : dow===6? '#0e6b73' : '#1a1a1a');
      ctx.font=`700 15px 'IBM Plex Mono',monospace`;
      ctx.fillText(String(d.getDate()), x+10, yy+22);
      if(hol){
        ctx.font=`600 10px ${FONT}`;
        const tw=ctx.measureText(hol).width;
        ctx.fillStyle='#fbe9e6';
        rrect(ctx,x+CELLW-tw-16,yy+8,tw+10,17,4); ctx.fill();
        ctx.fillStyle='#c0392b';
        ctx.fillText(hol, x+CELLW-tw-11, yy+19.5);
      }
    }
    wk.segs.forEach(sg=>{
      const n=sg.endCol-sg.startCol+1;
      const x=PAD+sg.startCol*(CELLW+GAP);
      const w=CELLW*n+GAP*(n-1)-4;
      const yb=y0+HEADER+sg.lane*BARH;
      ctx.fillStyle=projColor(sg.e.projectId);
      rrect(ctx,x+2,yb,w,BARH-6,5); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font=`600 13px ${FONT}`;
      ctx.textAlign='left';
      const label=(sg.contL&&sg.startCol===0?'‹ ':'')+(sg.e.title||'(제목 없음)')+(sg.contR?' ›':'');
      ctx.fillText(label, x+11, yb+(BARH-6)/2+4.5, w-20);
    });
    y0+=wk.h+GAP;
  });
  return cv;
}
function buildCalCanvas(){
  const title=document.querySelector('.cal-title'), wkd=document.querySelector('.weekdays'), body=document.querySelector('.cal-body');
  if(!wkd||!body)return null;
  const wkR=wkd.getBoundingClientRect(), bdR=body.getBoundingClientRect();
  const PAD=18, TITLEH=46, scale=2;
  const originX=Math.min(wkR.left,bdR.left), originY=wkR.top;
  const W=Math.max(wkR.width,bdR.width), H=(bdR.bottom-wkR.top);
  const cv=document.createElement('canvas');
  cv.width=Math.ceil((W+PAD*2)*scale); cv.height=Math.ceil((H+PAD*2+TITLEH)*scale);
  const ctx=cv.getContext('2d'); ctx.scale(scale,scale);
  const mapX=x=>x-originX+PAD, mapY=y=>y-originY+PAD+TITLEH;
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W+PAD*2,H+PAD*2+TITLEH);
  // 제목
  const mo=document.querySelector('.cal-title .mo'), yr=document.querySelector('.cal-title .yr');
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  if(mo){ctx.fillStyle=getComputedStyle(mo).color;ctx.font=fontOf(mo,'24px');ctx.fillText(mo.textContent,PAD,PAD+27);}
  const moW=mo?ctx.measureText(mo.textContent).width:0;
  if(yr){ctx.fillStyle=getComputedStyle(yr).color;ctx.font=fontOf(yr,'15px');ctx.fillText(yr.textContent,PAD+moW+8,PAD+27);}
  // 요일 헤더
  ctx.textAlign='center';
  wkd.querySelectorAll(':scope>div').forEach(dc=>{const r=dc.getBoundingClientRect();ctx.fillStyle=getComputedStyle(dc).color;ctx.font=fontOf(dc,'12px');ctx.fillText(dc.textContent,mapX(r.left+r.width/2),mapY(r.top+r.height/2)+4);});
  // 셀
  body.querySelectorAll('.cell').forEach(cell=>{
    const r=cell.getBoundingClientRect(), x=mapX(r.left), y=mapY(r.top), w=r.width, hh=r.height, cs=getComputedStyle(cell);
    const bg=cs.backgroundColor; ctx.fillStyle=(bg&&bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent')?bg:'#ffffff'; ctx.fillRect(x,y,w,hh);
    ctx.strokeStyle='#e6e6e6'; ctx.lineWidth=1; ctx.strokeRect(x+.5,y+.5,w-1,hh-1);
    const dn=cell.querySelector('.dnum');
    if(dn){const dr=dn.getBoundingClientRect();ctx.fillStyle=getComputedStyle(dn).color;ctx.font=fontOf(dn,'12px');ctx.textAlign='left';ctx.fillText(dn.textContent,mapX(dr.left),mapY(dr.top)+11);}
    const hl=cell.querySelector('.hol-lbl');
    if(hl){const hr=hl.getBoundingClientRect();ctx.fillStyle=getComputedStyle(hl).color;ctx.font=fontOf(hl,'9px');ctx.textAlign='left';ctx.fillText(hl.textContent,mapX(hr.left),mapY(hr.top)+9);}
    const mr=cell.querySelector('.more');
    if(mr){const rr=mr.getBoundingClientRect();ctx.fillStyle=getComputedStyle(mr).color;ctx.font=fontOf(mr,'9px');ctx.textAlign='right';ctx.fillText(mr.textContent,mapX(rr.right),mapY(rr.top)+10);}
  });
  // 일정 바
  body.querySelectorAll('.ebar').forEach(bar=>{
    const r=bar.getBoundingClientRect(), x=mapX(r.left), y=mapY(r.top), w=r.width, hh=r.height;
    ctx.fillStyle=getComputedStyle(bar).backgroundColor; rrect(ctx,x,y,w,hh,4); ctx.fill();
    const bc=bar.querySelector('.bc'); const bcT=bc?bc.textContent.trim():''; let full=bar.textContent; let titleT=bcT?full.slice(bcT.length):full;
    const txt=(bcT?bcT+' ':'')+titleT.trim();
    ctx.save(); rrect(ctx,x,y,w,hh,4); ctx.clip();
    ctx.fillStyle='#ffffff'; ctx.font=fontOf(bar,'11px'); ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(txt,x+6,y+hh/2+.5); ctx.restore(); ctx.textBaseline='alphabetic';
  });
  return cv;
}

function assignDragStart(ev,id){assignDragId=id;ev.currentTarget.classList.add('dragging');ev.dataTransfer.effectAllowed='move';}
function dragEnd(ev){ev.currentTarget.classList.remove('dragging');}
function assignAllowDrop(ev,col){ev.preventDefault();col.classList.add('drop');}
async function assignDrop(ev,assigneeId){
  ev.preventDefault();ev.currentTarget.classList.remove('drop');
  if(!isLeader()||!assignDragId)return;
  const id=assignDragId;assignDragId=null;
  const t=assignTasks.find(x=>x.id===id);if(!t||t.assignee===assigneeId)return;
  const prev=t.assignee;
  t.assignee=assigneeId;assignRenderShell();
  const {error}=await sb.from('assign_tasks').update({assignee:assigneeId,updated_by:profile.id}).eq('id',id);
  if(error){console.error(error);t.assignee=prev;assignRenderShell();alert('배정 변경 중 오류가 발생했어요. 다시 시도해주세요.');}
}
async function assignComplete(id){
  const t=assignTasks.find(x=>x.id===id);if(!t)return;
  if(!isLeader()&&t.assignee!==profile.id)return;
  const prevStatus=t.status,prevDoneAt=t.done_at;
  // 같은 업무를 여러 명에게 배정한 경우(group_id 공유) 한 명이 체크하면 나머지 사본은 전부
  // 사라지고, 체크한 사람의 사본만 완료 기록으로 남는다.
  const siblings=t.group_id?assignTasks.filter(x=>x.group_id===t.group_id&&x.id!==t.id):[];
  t.status='done';t.done_at=new Date().toISOString();
  if(siblings.length)assignTasks=assignTasks.filter(x=>x.group_id!==t.group_id||x.id===t.id);
  assignRenderShell();
  const {error}=await sb.from('assign_tasks').update({status:'done',done_at:t.done_at,updated_by:profile.id}).eq('id',id);
  if(error){console.error(error);t.status=prevStatus;t.done_at=prevDoneAt;if(siblings.length)assignTasks.push(...siblings);assignRenderShell();alert('완료 처리 중 오류가 발생했어요. 다시 시도해주세요.');return;}
  if(siblings.length){
    const {error:delErr}=await sb.from('assign_tasks').delete().in('id',siblings.map(s=>s.id));
    if(delErr)console.error(delErr);
  }
}
async function assignAddTask(){
  if(!isLeader())return;
  const inp=document.getElementById('assign-new-text'),sel=document.getElementById('assign-new-prio');
  if(!inp)return;
  const text=(inp.value||'').trim();if(!text)return;
  const priority=sel?sel.value:'mid';
  const chipRow=document.getElementById('assign-new-assignees');
  const selectedIds=chipRow?Array.from(chipRow.querySelectorAll('.achip.on')).map(c=>c.dataset.pid):[];
  inp.disabled=true;
  const groupId=selectedIds.length>1?((window.crypto&&crypto.randomUUID)?crypto.randomUUID():uid()):null;
  const baseRow={text,priority,created_by:profile.id,updated_by:profile.id};
  const payload=selectedIds.length?selectedIds.map(pid=>({...baseRow,assignee:pid,group_id:groupId})):[baseRow];
  const {data:rows,error}=await sb.from('assign_tasks').insert(payload).select();
  if(error){console.error(error);alert('업무 생성 중 오류가 발생했어요. 다시 시도해주세요.');inp.disabled=false;return;}
  assignTasks.push(...(rows||[]));
  assignRenderShell();
  const freshInp=document.getElementById('assign-new-text');if(freshInp)freshInp.focus();
}
async function assignDeleteTask(id){
  if(!isLeader())return;
  if(!confirm('이 업무를 삭제할까요?'))return;
  const idx=assignTasks.findIndex(x=>x.id===id);if(idx<0)return;
  const removed=assignTasks[idx];
  assignTasks.splice(idx,1);assignRenderShell();
  const {error}=await sb.from('assign_tasks').delete().eq('id',id);
  if(error){console.error(error);assignTasks.splice(idx,0,removed);assignRenderShell();alert('삭제 중 오류가 발생했어요. 다시 시도해주세요.');}
}

function setTitle(v){const e=cur();if(e){e.title=v;queueSave();}}
function setMemo(v){const e=cur();if(e){e.memo=v;queueSave();}}
function setProject(id){const e=cur();if(e){e.projectId=id;save();renderModal(false);refreshBg();}}
function setPrice(v){const e=cur();if(!e)return;const n=parseInt(String(v).replace(/[^\d]/g,''),10);e.price=isNaN(n)?0:n;save();}
function fmtPriceInput(el){const n=parseInt(el.value.replace(/[^\d]/g,''),10);el.value=isNaN(n)?'':n.toLocaleString('ko-KR');}
function toggleLeave(on){const e=cur();if(!e)return;if(on){e.leave=e.leave||inferLeave(e);if(e.leave.kind!=='hour'&&typeof e.leave.days!=='number'){const k=LK[e.leave.kind]||LK.annual;e.leave.days=k.def*(k.id==='annual'?spanWeekdays(e):1);}}else{delete e.leave;}save();renderModal(false);refreshBg();}
function setLeaveKind(k){const e=cur();if(!e||!e.leave)return;e.leave.kind=k;const def=LK[k]||LK.annual;if(k==='hour'){e.leave.hours=e.leave.hours||1;delete e.leave.days;}else{e.leave.days=def.def*(k==='annual'?spanWeekdays(e):1);delete e.leave.hours;}save();renderModal(false);refreshBg();}
function setLeaveDays(v){const e=cur();if(!e||!e.leave)return;e.leave.days=Math.max(0,+v||0);save();renderModal(false);refreshBg();}
function setLeaveHours(v){const e=cur();if(!e||!e.leave)return;e.leave.hours=Math.max(0,+v||0);save();renderModal(false);refreshBg();}
function setStart(v){const e=cur();if(!e||!v)return;e.date=v;if(dayNum(e.endDate||v)<dayNum(v))e.endDate=v;save();renderModal(false);refreshBg();}
function setEnd(v){const e=cur();if(!e||!v)return;if(dayNum(v)<dayNum(e.date))v=e.date;e.endDate=v;save();renderModal(false);refreshBg();}
function addTodo(){const e=cur();if(!e)return;const inp=document.getElementById('td-in'),txt=inp.value.trim();if(!txt)return;const prio=document.getElementById('td-prio').value;if(!e.todos)e.todos=[];e.todos.push({id:uid(),text:txt,priority:prio,status:'todo'});inp.value='';save();renderModal(false);const ni=document.getElementById('td-in');if(ni)ni.focus();refreshBg();}
function toggleDone(evId,tId){if(!isLeader())return;const e=data.events.find(x=>x.id===evId);if(!e)return;const t=(e.todos||[]).find(x=>x.id===tId);if(!t)return;t.status=t.status==='done'?'todo':'done';save();if(openId)renderModal(false);refreshBg();}
function setStatus(tId,v){const e=cur();if(!e)return;const t=e.todos.find(x=>x.id===tId);if(t){t.status=v;save();renderModal(false);refreshBg();}}
function setPrio(tId,v){const e=cur();if(!e)return;const t=e.todos.find(x=>x.id===tId);if(t){t.priority=v;save();renderModal(false);refreshBg();}}
function delTodo(tId){const e=cur();if(!e)return;e.todos=e.todos.filter(x=>x.id!==tId);save();renderModal(false);refreshBg();}
function delEvent(){const e=cur();if(!e)return;const label=e.title?`'${e.title}'`:'이 일정';if(!confirm(`${label}을(를) 삭제할까요? 안의 할일도 함께 사라집니다.`))return;data.events=data.events.filter(x=>x.id!==openId);closeModal();save();refreshBg();}
function applyTemplate(){const e=cur();if(!e)return;const sel=document.getElementById('tmpl-sel');if(!sel||!sel.value)return;const t=data.templates.find(x=>x.id===sel.value);if(!t)return;if(!e.todos)e.todos=[];t.todos.forEach(td=>e.todos.push({id:uid(),text:td.text,priority:td.priority,status:'todo'}));if(!e.title.trim())e.title=t.name;save();renderModal(false);refreshBg();}

function closeModal(){const e=cur();if(isLeader()&&e&&!e.title.trim()&&!(e.todos||[]).length&&!(e.memo||'').trim()&&!e.leave)data.events=data.events.filter(x=>x.id!==openId);openId=null;document.getElementById('scrim').classList.remove('show');if(pendingRemoteSchedule){data=pendingRemoteSchedule;pendingRemoteSchedule=null;migrate();}refreshBg();}

/* ⚡ 금일 업무 보고 복사 ── 오늘 걸쳐 있는 일정을 상태별로 모아 메신저용 텍스트로 복사 */
function reportState(e){
  // 금일 보고: 할일이 전부 '완료'면 완료, 그 외(할일 없음·일부 진행·전부 미착수)는 모두 진행 중
  const todos=e.todos||[];
  if(todos.length&&todos.every(t=>t.status==='done'))return 'done';
  return 'doing';
}
function copyTodayReport(){
  // 오늘(TODAY_STR)이 시작~종료 사이에 포함되는 일정 필터링
  const todays=data.events.filter(e=>{
    const a=dayNum(e.date), b=dayNum(e.endDate||e.date);
    return TODAY_NUM>=a && TODAY_NUM<=b;
  });
  if(!todays.length){alert('📢 오늘 날짜로 등록된 업무나 할 일이 없습니다.');return;}
  // 상태별 분류
  const groups={done:[],doing:[],todo:[]};
  todays.forEach(e=>{
    const p=proj(e.projectId);
    const title=(e.title||'').trim()||'(제목 없음)';
    const line=p?`- [${p.name}] ${title}`:`- ${title}`;
    (groups[reportState(e)]||groups.todo).push(line);
  });
  // 날짜 + 요일
  const [y,m,d]=TODAY_STR.split('-');
  const dow=WD[new Date(+y,+m-1,+d).getDay()];
  const bar='==================================';
  const sections=[];
  if(groups.done.length) sections.push('✅ 완료된 업무\n'+groups.done.join('\n'));
  if(groups.doing.length)sections.push('⏳ 진행 중인 업무\n'+groups.doing.join('\n'));
  if(groups.todo.length) sections.push('📋 예정/보류 업무\n'+groups.todo.join('\n'));
  const text=`📢 [${y}.${m}.${d} (${dow})] 금일 업무 보고\n${bar}\n${sections.join('\n')}\n${bar}\n(본 내용은 업무 일정 관리 앱에서 복사되었습니다.)`;
  const n=todays.length;
  const ok=()=>alert(`🚀 오늘 업무(${n}건)가 메신저용으로 복사되었습니다!\n원하는 창에 Ctrl+V 하세요.`);
  const fail=()=>{
    // navigator.clipboard 미지원/거부 시 폴백
    try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='-9999px';document.body.appendChild(ta);ta.focus();ta.select();const done=document.execCommand('copy');ta.remove();if(done){ok();return;}}catch(e){}
    alert('❌ 복사에 실패했습니다. 브라우저 클립보드 권한을 확인하거나 다시 시도해 주세요.');
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok).catch(fail);}
  else fail();
}
function importData(input){if(!isLeader()){alert('팀원 계정은 가져오기를 할 수 없어요.');input.value='';return;}const f=input.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const parsed=JSON.parse(rd.result);if(!parsed||!Array.isArray(parsed.events))throw 0;if(!confirm(`백업 파일을 불러오면 현재 데이터를 덮어씁니다.\n일정 ${parsed.events.length}건을 불러올까요?`)){input.value='';return;}data=parsed;migrate();save();renderAll();alert('불러오기 완료.');}catch(e){alert('불러오기 실패: 올바른 백업 파일이 아니에요.');}input.value='';};rd.readAsText(f);}

/* ── ITP 번호대장 (LTTD-{연도}-K{순번}, 연도별로 K001부터 매년 리셋) ── */
let itpNumbers=[];
function itpFullNo(year,seq){return `LTTD-${year}-K${String(seq).padStart(3,'0')}`;}
function itpNextSeq(year){const max=itpNumbers.filter(r=>r.year===year).reduce((m,r)=>Math.max(m,r.seq),0);return max+1;}
async function itpLoad(){
  const {data:rows,error}=await sb.from('itp_numbers').select('*').order('year',{ascending:false}).order('seq',{ascending:false});
  if(error){console.error(error);itpNumbers=[];return;}

        <button class="itp-btn" id="itp-issue-btn" onclick="itpIssue()">번호 발급</button>

      <div class="itp-preview-hint">순번은 자동으로 다음 번호가 채워지지만, 이미 대장 밖에서 더 앞서 쓰고 있는 번호가 있으면 위 칸에 직접 입력해서 그 다음부터 이어 발급할 수 있어요.</div>
    </div>
    <div class="itp-list-head"><h3>발급 내역</h3><span class="itp-count">총 ${itpNumbers.length}건</span></div>
    <div class="itp-list">${rows||'<div class="kempty">아직 발급된 번호가 없어요.</div>'}</div>`;

  const prevEl=document.getElementById('itp-preview-txt');

    const y=yearSel?parseInt(yearSel.value,10):previewYear;
    let s=seqInp?parseInt(seqInp.value,10):previewSeq;
    if(!s||s<1||isNaN(s))s=1;
    if(prevEl)prevEl.textContent=`발급될 번호: ${itpFullNo(y,s)}`;
  }
  if(yearSel)yearSel.onchange=()=>{
    const y=parseInt(yearSel.value,10);
    if(seqInp)seqInp.value=itpNextSeq(y);
    itpSyncPreview();
  };
  if(seqInp)seqInp.oninput=itpSyncPreview;

function itpReSort(){itpNumbers.sort((a,b)=>b.year-a.year||b.seq-a.seq);}
async function itpIssue(){
  const yearSel=document.getElementById('itp-new-year');
  const year=yearSel?parseInt(yearSel.value,10):new Date().getFullYear();
  const seqInp=document.getElementById('itp-new-seq');
  const autoSeq=itpNextSeq(year);
  let seq=seqInp?parseInt(seqInp.value,10):autoSeq;
  if(!seq||seq<1||isNaN(seq))seq=autoSeq;
  const manualOverride=seq!==autoSeq; // 순번 칸을 직접 고쳐서 발급하는 경우 (예: 대장 밖에서 이미 K028까지 썼을 때)
  const itemInp=document.getElementById('itp-new-item'),noteInp=document.getElementById('itp-new-note');
  const item=(itemInp&&itemInp.value||'').trim();
  const note=(noteInp&&noteInp.value||'').trim();
  const btn=document.getElementById('itp-issue-btn');if(btn)btn.disabled=true;
  const {data:row,error}=await sb.from('itp_numbers').insert({year,seq,full_no:itpFullNo(year,seq),item_desc:item,note,created_by:profile.id}).select().single();
  if(error){
    console.error(error);
    if(error.code==='23505'){
      if(manualOverride){
        alert(`${itpFullNo(year,seq)} 번호는 이미 쓰고 있어요. 다른 순번을 입력해주세요.`);
        if(btn)btn.disabled=false;return;
      }
      // 동시에 두 명이 같은 순번으로 발급 시도한 경우 — 최신 내역을 다시 받아서 한 번만 재시도
      await itpLoad();
      const retrySeq=itpNextSeq(year);
      const {data:row2,error:err2}=await sb.from('itp_numbers').insert({year,seq:retrySeq,full_no:itpFullNo(year,retrySeq),item_desc:item,note,created_by:profile.id}).select().single();
      if(err2){console.error(err2);alert('번호 발급 중 오류가 발생했어요. 다시 시도해주세요.');if(btn)btn.disabled=false;return;}
      itpNumbers.unshift(row2);itpReSort();
    }else{
      alert('번호 발급 중 오류가 발생했어요. 다시 시도해주세요.');
      if(btn)btn.disabled=false;return;
    }
  }else{
    itpNumbers.unshift(row);itpReSort();
  }
  if(btn)btn.disabled=false;
  if(viewMode==='misc')miscRenderSection();
}
async function itpDeleteNumber(id){
  if(!isLeader())return;
  const t=itpNumbers.find(x=>x.id===id);if(!t)return;
  if(!confirm(`${t.full_no} 번호를 삭제할까요? (이 번호는 다시 발급되지 않고 빈 번호로 남아요)`))return;
  const idx=itpNumbers.findIndex(x=>x.id===id);if(idx<0)return;
  const removed=itpNumbers[idx];
  itpNumbers.splice(idx,1);if(viewMode==='misc')miscRenderSection();
  const {error}=await sb.from('itp_numbers').delete().eq('id',id);
  if(error){console.error(error);itpNumbers.splice(idx,0,removed);if(viewMode==='misc')miscRenderSection();alert('삭제 중 오류가 발생했어요. 다시 시도해주세요.');}
}

function supplyPad(n){return String(n).padStart(2,'0');}
function supplyCurrentYM(){const d=new Date();return d.getFullYear()+'-'+supplyPad(d.getMonth()+1);}
function supplyYmLabel(ym){const p=ym.split('-');return p[0]+'년 '+parseInt(p[1],10)+'월';}
function supplyShiftYM(ym,delta){const p=ym.split('-').map(Number);const d=new Date(p[0],p[1]-1+delta,1);return d.getFullYear()+'-'+supplyPad(d.getMonth()+1);}
function supplyWon(n){return '₩'+(Number(n)||0).toLocaleString('ko-KR');}
function supplyRowToItem(r){return {id:r.id,name:r.name,link:r.link||'',photo:r.photo||'',qty:r.qty,unitPrice:r.unit_price,note:r.note||'',requester:r.requester,requesterId:r.requester_id,createdAt:r.created_at,priority:r.priority||'보통'};}

function supplyCompressImage(file,maxWidth,quality){
  maxWidth=maxWidth||480;quality=quality||0.7;
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxWidth/img.width);
        const canvas=document.createElement('canvas');
        canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;img.src=e.target.result;
    };
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}
function supplyHandlePhotoFile(file){
  if(!file)return;
  const labelText=document.getElementById('sp-attach-label-text');
  if(labelText)labelText.textContent='처리 중...';
  supplyCompressImage(file).then((dataUrl)=>{
    supplyState.photoData=dataUrl;
    if(labelText)labelText.textContent='파일 선택';
    const slot=document.getElementById('sp-photo-preview-slot');
    if(!slot)return;
    slot.innerHTML=`<div class="photo-thumb-wrap"><img class="photo-thumb" src="${dataUrl}"><button type="button" class="photo-remove" id="sp-remove-photo">✕</button></div>`;
    document.getElementById('sp-remove-photo').addEventListener('click',()=>{supplyState.photoData='';slot.innerHTML='';});
    supplyShowToast('사진이 첨부됐습니다');
  }).catch(()=>{
    if(labelText)labelText.textContent='파일 선택';
    supplyShowFormError('사진 처리에 실패했습니다. 다른 파일이나 캡처로 시도해 주세요.');
  });
}

function supplyAttachShellEvents(){
  document.querySelectorAll('#supply-view .tab-btn').forEach(btn=>{

      if(btn.dataset.view==='admin'&&!isSupplyAdmin())return;
      supplyState.view=btn.dataset.view;
      renderSuppliesView();
    });
  });
  const prevBtn=document.getElementById('sp-prev-month'),nextBtn=document.getElementById('sp-next-month');
  if(prevBtn)prevBtn.addEventListener('click',async()=>{supplyState.ym=supplyShiftYM(supplyState.ym,-1);await supplyLoadState();renderSuppliesView();});
  if(nextBtn)nextBtn.addEventListener('click',async()=>{supplyState.ym=supplyShiftYM(supplyState.ym,1);await supplyLoadState();renderSuppliesView();});
  const form=document.getElementById('sp-add-form');
  if(form){
    const photoInput=document.getElementById('sp-f-photo');
    photoInput.addEventListener('change',()=>{const file=photoInput.files&&photoInput.files[0];supplyHandlePhotoFile(file);});
    form.addEventListener('submit',async(e)=>{
      e.preventDefault();
      const name=document.getElementById('sp-f-name').value.trim();
      const qty=Math.max(1,Number(document.getElementById('sp-f-qty').value)||1);
      const link=document.getElementById('sp-f-link').value.trim();
      const priceRaw=document.getElementById('sp-f-price').value;
      const note=document.getElementById('sp-f-note').value.trim();
      const priority=document.getElementById('sp-f-priority').value;
      const priceValid=String(priceRaw).trim()!==''&&Number(priceRaw)>0;
      if(!name||!link||!supplyState.photoData||!priceValid){supplyShowFormError('상품명·구매 링크·사진·단가를 입력해 주세요.');return;}
      supplyShowFormError('');
      const submitBtn=document.getElementById('sp-submit-btn');if(submitBtn)submitBtn.disabled=true;
      const item={name,link,photo:supplyState.photoData,qty,unitPrice:Number(priceRaw)||0,note,requester:profile.name,priority};
      const ok=await supplyInsertItem(item);
      if(!ok){supplyShowFormError('등록 중 오류가 발생했어요. 다시 시도해주세요.');if(submitBtn)submitBtn.disabled=false;return;}
      await supplyLoadState();
      supplyState.photoData='';
      supplyShowToast('등록되었습니다');
      renderSuppliesView();
    });
  }
  if(!window.__supplyPasteBound){document.addEventListener('paste',supplyPasteHandler);window.__supplyPasteBound=true;}
}
function supplyPasteHandler(e){
  if(viewMode!=='supplies'||supplyState.view!=='requester')return;
  if(!document.getElementById('sp-add-form'))return;
  const cd=e.clipboardData||(e.originalEvent&&e.originalEvent.clipboardData);
  if(!cd||!cd.items)return;
  for(let i=0;i<cd.items.length;i++){
    if(cd.items[i].type.indexOf('image')!==-1){
      const file=cd.items[i].getAsFile();
      supplyHandlePhotoFile(file);
      e.preventDefault();
      break;
    }
  }
}
function supplyPriorityRank(p){return p==='긴급'?0:(p==='낮음'?2:1);}
function supplySortedItems(){
  return supplyState.items.slice().sort((a,b)=>{
    const r=supplyPriorityRank(a.priority)-supplyPriorityRank(b.priority);
    if(r!==0)return r;
    return new Date(a.createdAt)-new Date(b.createdAt);
  });
}
function supplyPriorityBadge(p){

      html+='<div class="table-scroll"><table class="supply-table"><thead><tr><th style="width:36px">No</th><th class="left">상품명</th><th style="width:88px">우선순위</th><th style="width:110px">단가</th><th style="width:68px">수량</th><th style="width:100px">금액</th><th style="width:180px">비고<small>(알파몰 코드)</small></th><th style="width:104px">신청자</th><th style="width:76px"></th></tr></thead><tbody>';
      items.forEach((it,i)=>{
        const amount=(Number(it.unitPrice)||0)*(Number(it.qty)||0);
        html+=`<tr data-row="${it.id}"><td class="center mono">${i+1}</td><td><div class="prod-cell">`;
        html+=it.photo?`<img class="prod-thumb" src="${it.photo}" data-photo-view="${it.id}" style="cursor:zoom-in">`:'<div class="prod-thumb-empty"></div>';
        html+='<div style="min-width:0">';

        if(it.link)html+=`<a class="prod-link" href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">${esc(it.link)}</a>`;
        html+='</div></div></td>';
        html+=`<td><select class="cell-input" data-id="${it.id}" data-field="priority"><option value="긴급" ${it.priority==='긴급'?'selected':''}>긴급</option><option value="보통" ${(!it.priority||it.priority==='보통')?'selected':''}>보통</option><option value="낮음" ${it.priority==='낮음'?'selected':''}>낮음</option></select></td>`;
        html+=`<td><input class="cell-input price" data-id="${it.id}" data-field="unitPrice" type="number" min="0" value="${esc(it.unitPrice)}"></td>`;

        html+=`<td class="center row-actions"><button class="move-next-btn icon-only" data-move="${it.id}" title="다음 달로 이동">▶</button><button class="trash-btn" data-del="${it.id}">🗑</button></td></tr>`;
      });
      html+=`</tbody><tfoot><tr><td colspan="5" class="center">총 금액</td><td class="right mono" id="sp-total-amount-cell">${supplyWon(t.amount)}</td><td colspan="3"></td></tr></tfoot></table></div>`;

    html+='</div>';
    if(supplyState.items.length>0)html+='<div class="clear-row"><button class="clear-link" id="sp-clear-all-btn">이 달 목록 전체 삭제</button></div>';

  }
  supplyAttachListEvents();
}
function supplyAttachListEvents(){
  const box=document.getElementById('sp-list-container');
  box.querySelectorAll('[data-photo-view]').forEach(img=>{
    img.addEventListener('click',()=>{
      const item=supplyState.items.find(it=>it.id===img.dataset.photoView);
      if(item&&item.photo)openPhotoLightbox(item.photo);
    });
  });
  box.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const id=btn.dataset.del;
      const ok=await supplyDeleteItem(id);
      if(!ok)return; // 실패 시 목록에서 지우지 않음 (성공한 것처럼 보이지 않게)
      supplyState.items=supplyState.items.filter(it=>it.id!==id);
      supplyRenderList();
    });
  });
  box.querySelectorAll('[data-move]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const id=btn.dataset.move;
      const nextYm=supplyShiftYM(supplyState.ym,1);
      if(!confirm(`다음 달(${supplyYmLabel(nextYm)}) 목록으로 옮길까요?`))return;
      await supplyMoveItemToYm(id,nextYm);
      await supplyLoadState();
      supplyRenderList();
    });
  });
  const refreshBtn=document.getElementById('sp-refresh-btn');
  if(refreshBtn)refreshBtn.addEventListener('click',async()=>{await supplyLoadState();supplyRenderList();});
  const clearBtn=document.getElementById('sp-clear-all-btn');
  if(clearBtn)clearBtn.addEventListener('click',async()=>{
    if(!confirm(supplyYmLabel(supplyState.ym)+' 목록 '+supplyState.items.length+'건을 모두 삭제하시겠습니까? 삭제 후 복구할 수 없습니다.'))return;
    const ok=await supplyClearAllItems();
    if(!ok)return; // 실패 시 목록을 비우지 않음
    supplyState.items=[];
    supplyRenderList();
  });
  const copyBtn=document.getElementById('sp-copy-btn');
  if(copyBtn)copyBtn.addEventListener('click',()=>{
    if(supplyState.items.length===0)return;
    const lines=[['No','상품명','단가','수량','금액','비고'].join('\t')];
    supplyState.items.forEach((it,i)=>{
      const amount=(Number(it.unitPrice)||0)*(Number(it.qty)||0);
      lines.push([i+1,it.name,Number(it.unitPrice)||0,Number(it.qty)||0,amount,it.note||''].join('\t'));
    });
    const t=supplyTotals();
    lines.push(['','총 금액','','',t.amount,''].join('\t'));
    const text=lines.join('\n');
    navigator.clipboard.writeText(text).then(()=>{supplyShowToast('기안 표를 복사했습니다 (엑셀에 바로 붙여넣기 가능)');}).catch(()=>{alert('복사 권한이 없습니다. 브라우저 설정을 확인해 주세요.');});
  });
  box.querySelectorAll('[data-field]').forEach(input=>{
    input.addEventListener('input',()=>{
      const id=input.dataset.id,field=input.dataset.field;
      const item=supplyState.items.find(it=>it.id===id);
      if(!item)return;
      item[field]=input.value;
      const row=input.closest('tr');
      const amount=(Number(item.unitPrice)||0)*(Number(item.qty)||0);
      const amtCell=row.querySelector('.amount-cell');
      if(amtCell)amtCell.textContent=supplyWon(amount);
      const tt=supplyTotals();
      const totalCell=document.getElementById('sp-total-amount-cell');
      if(totalCell)totalCell.textContent=supplyWon(tt.amount);
      const statLine=document.getElementById('sp-admin-stat-line');
      if(statLine)statLine.textContent='총 '+supplyState.items.length+'건 · 수량 합계 '+tt.qty+'개 · 총 금액 '+supplyWon(tt.amount);
    });
    input.addEventListener('change',()=>{supplyUpdateItemField(input.dataset.id,input.dataset.field,input.value);});
  });
}


/* ═══════════ 주간업무보고 ═══════════ */
let wrWeekStart='', wrReport=null, wrSaveT=null, lastSelfWrSaveAt=0;
let wrPendingSave=null, wrLoadToken=0;

function wrMonday(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const day=d.getDay();
  const diff=(day===0?-6:1-day);
  d.setDate(d.getDate()+diff);
  return ymd(d);
}
function wrAddDays(dateStr,n){
  const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d);
}
function wrRangeLabel(monday){
  const d1=new Date(monday+'T00:00:00'); const d2=new Date(d1); d2.setDate(d1.getDate()+6);
  return `${d1.getMonth()+1}/${d1.getDate()}~${d2.getMonth()+1}/${d2.getDate()}`;
}
function wrWeekHeaderLabel(monday){
  const d1=new Date(monday+'T00:00:00'); const d2=new Date(d1); d2.setDate(d1.getDate()+6);
  return `${d1.getMonth()+1}/${d1.getDate()} ~ ${d2.getMonth()+1}/${d2.getDate()} 주`;
}
function wrDefaultReport(monday){
  const nextMon=wrAddDays(monday,7);
  return {
    weekStart:monday,
    thisLabel:wrRangeLabel(monday),
    thisGroups:[{name:'자체검사 & 입회검사',items:[{text:'',sched:''}]}],
    nextLabel:wrRangeLabel(nextMon),
    nextGroups:[{name:'자체검사',items:[{text:'',sched:''}]},{name:'고객검사',items:[{text:'',sched:''}]}],
    etc:['','','']
  };
}
async function wrInitLoad(){
  wrWeekStart=wrMonday(TODAY_STR);
  await wrLoadReport(wrWeekStart);
}
async function wrLoadReport(weekStart){
  const myToken=++wrLoadToken;
  const {data:row,error}=await sb.from('weekly_reports').select('payload').eq('week_start',weekStart).maybeSingle();
  if(myToken!==wrLoadToken)return; // 그 사이에 더 최신 주 이동 요청이 있었으면 이 응답은 버림 (뒤늦게 도착한 응답이 화면을 덮지 않게)
  if(error){
    console.error(error);
    alert('주간보고를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해줘.');
    wrReport=wrDefaultReport(weekStart);
    return;
  }
  wrReport=(row&&row.payload&&Object.keys(row.payload).length)?row.payload:wrDefaultReport(weekStart);
  if(!wrReport.etc)wrReport.etc=[''];
}
async function wrSave(weekStart,reportSnapshot){
  const {error}=await sb.from('weekly_reports').upsert({week_start:weekStart,payload:reportSnapshot,updated_by:profile.id,updated_at:new Date().toISOString()});
  if(error){console.error(error);return false;}
  lastSelfWrSaveAt=Date.now();
  return true;
}
function wrSoftSave(){
  const el=document.getElementById('wr-saved');if(el){el.textContent='저장 중…';el.classList.remove('save-error');el.classList.add('saving');el.onclick=null;}
  clearTimeout(wrSaveT);
  const weekStartSnap=wrWeekStart;
  const reportSnap=JSON.parse(JSON.stringify(wrReport));
  wrPendingSave={weekStart:weekStartSnap,report:reportSnap};
  wrSaveT=setTimeout(async()=>{
    wrSaveT=null;
    const ok=await wrSave(weekStartSnap,reportSnap);
    if(wrPendingSave && wrPendingSave.weekStart===weekStartSnap && !wrSaveT) wrPendingSave=null;
    const e2=document.getElementById('wr-saved');
    if(e2){
      e2.classList.remove('saving');
      if(ok){e2.textContent='저장됨';e2.classList.remove('save-error');e2.onclick=null;}
      else{e2.textContent='⚠ 저장 실패 · 클릭해서 재시도';e2.classList.add('save-error');e2.onclick=wrSoftSave;}
    }
  },500);
}
async function wrFlushPendingSave(){
  if(wrSaveT){clearTimeout(wrSaveT);wrSaveT=null;}
  if(!wrPendingSave)return true;
  const {weekStart,report}=wrPendingSave;
  wrPendingSave=null;
  const ok=await wrSave(weekStart,report);
  if(!ok)wrPendingSave={weekStart,report};
  return ok;
}
async function wrSwitchWeek(delta){
  const ok=await wrFlushPendingSave();
  if(!ok && !confirm('방금 입력한 내용을 저장하지 못했어요. 그래도 다른 주로 이동할까요? (지금 입력한 내용은 저장 안 돼요)'))return;
  wrWeekStart=wrAddDays(wrWeekStart,delta*7);
  await wrLoadReport(wrWeekStart);
  wrRenderShell();
}
async function wrGoThisWeek(){
  const ok=await wrFlushPendingSave();
  if(!ok && !confirm('방금 입력한 내용을 저장하지 못했어요. 그래도 이번 주로 이동할까요? (지금 입력한 내용은 저장 안 돼요)'))return;
  wrWeekStart=wrMonday(TODAY_STR);
  await wrLoadReport(wrWeekStart);
  wrRenderShell();
}
function wrSectionArr(section){ return section==='this'?wrReport.thisGroups:wrReport.nextGroups; }
function wrAddGroup(section){ wrSectionArr(section).push({name:'',items:[{text:'',sched:''}]}); wrSoftSave(); wrRenderShell(); }
function wrDeleteGroup(section,gi){ if(!confirm('이 분류를 삭제할까요? 안의 내용도 함께 삭제돼요.'))return; wrSectionArr(section).splice(gi,1); wrSoftSave(); wrRenderShell(); }
function wrUpdateGroupName(section,gi,val){ wrSectionArr(section)[gi].name=val; wrSoftSave(); }
function wrAddItem(section,gi){ wrSectionArr(section)[gi].items.push({text:'',sched:''}); wrSoftSave(); wrRenderShell(); }
function wrDeleteItem(section,gi,ii){ wrSectionArr(section)[gi].items.splice(ii,1); wrSoftSave(); wrRenderShell(); }
function wrUpdateItemText(section,gi,ii,val){ wrSectionArr(section)[gi].items[ii].text=val; wrSoftSave(); }
function wrUpdateItemSched(section,gi,ii,val){ wrSectionArr(section)[gi].items[ii].sched=val; wrSoftSave(); }
function wrUpdateLabel(section,val){ if(section==='this')wrReport.thisLabel=val; else wrReport.nextLabel=val; wrSoftSave(); }
function wrAddEtc(){ wrReport.etc.push(''); wrSoftSave(); wrRenderShell(); }
function wrDeleteEtc(i){ wrReport.etc.splice(i,1); wrSoftSave(); wrRenderShell(); }
function wrUpdateEtc(i,val){ wrReport.etc[i]=val; wrSoftSave(); }
function wrAutoGrow(el){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }

function wrRenderSection(section){
  const groups=wrSectionArr(section);
  const label=section==='this'?wrReport.thisLabel:wrReport.nextLabel;
  const titleText=section==='this'?'금주의 업무':'차주 업무 계획';
  let html=`<div class="wr-sec-head ${section==='this'?'wr-sec-head-this':'wr-sec-head-next'}">
    <span class="wr-sec-icon">${section==='this'?'📅':'📋'}</span>
    <span class="wr-sec-title">${titleText} :</span>
    <input class="wr-range-input" value="${esc(label)}" onchange="wrUpdateLabel('${section}',this.value)">
    <span class="wr-sec-col-lbl">일정</span>
  </div>`;
  groups.forEach((g,gi)=>{
    html+=`<div class="wr-group">
      <div class="wr-group-head">
        <input class="wr-group-name" value="${esc(g.name)}" onchange="wrUpdateGroupName('${section}',${gi},this.value)" placeholder="분류명 (예: 자체검사)">
        <button class="wr-del-group" onclick="wrDeleteGroup('${section}',${gi})" title="분류 삭제">×</button>
      </div>
      <div class="wr-items">`;
    g.items.forEach((it,ii)=>{
      html+=`<div class="wr-item-row">
        <span class="wr-dash">-</span>
        <textarea class="wr-item-text" rows="1" oninput="wrAutoGrow(this)" onchange="wrUpdateItemText('${section}',${gi},${ii},this.value)" placeholder="업무 내용을 입력하세요">${esc(it.text)}</textarea>
        <input class="wr-item-sched" value="${esc(it.sched)}" onchange="wrUpdateItemSched('${section}',${gi},${ii},this.value)" placeholder="일정">
        <button class="wr-del-item" onclick="wrDeleteItem('${section}',${gi},${ii})" title="줄 삭제">×</button>
      </div>`;
    });
    html+=`</div>
      <button class="wr-add-item" onclick="wrAddItem('${section}',${gi})">+ 줄 추가</button>
    </div>`;
  });
  html+=`<button class="wr-add-group" onclick="wrAddGroup('${section}')">+ 분류 추가</button>`;
  return html;
}
function wrRenderEtcSection(){
  let html=`<div class="wr-sec-head wr-sec-head-etc"><span class="wr-sec-icon">📌</span><span class="wr-sec-title">기타 업무 공유 내용 (출장/불량 등)</span></div><div class="wr-etc-list">`;
  wrReport.etc.forEach((val,i)=>{
    html+=`<div class="wr-item-row">
      <span class="wr-etc-num">${i+1})</span>
      <textarea class="wr-item-text" rows="1" oninput="wrAutoGrow(this)" onchange="wrUpdateEtc(${i},this.value)" placeholder="내용을 입력하세요">${esc(val)}</textarea>
      <button class="wr-del-item" onclick="wrDeleteEtc(${i})" title="줄 삭제">×</button>
    </div>`;
  });
  html+=`</div><button class="wr-add-item" onclick="wrAddEtc()">+ 줄 추가</button>`;
  return html;
}
function wrRenderShell(){
  const wrap=document.getElementById('main-panel');
  wrap.innerHTML=`<div id="wr-view"><div class="wr-wrap">
    <div class="wr-head">
      <div class="wr-title">주간업무보고</div>
      <div class="wr-week-nav">
        <button class="wr-nav-btn" onclick="wrSwitchWeek(-1)">‹</button>
        <span class="wr-week-label" id="wr-week-label">${wrWeekHeaderLabel(wrWeekStart)}</span>
        <button class="wr-nav-btn" onclick="wrSwitchWeek(1)">›</button>
        <button class="wr-thisweek-btn" onclick="wrGoThisWeek()">이번 주</button>
        <button class="wr-search-btn" onclick="wrOpenSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>지난 보고 검색</button>
      </div>
      <div class="wr-head-actions">
        <span class="wr-saved" id="wr-saved">자동 저장</span>
        <button class="wr-export-btn" onclick="wrExportExcel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>엑셀로 내보내기</button>
      </div>
    </div>
    <div id="wr-section-this"></div>
    <div id="wr-section-next"></div>
    <div id="wr-section-etc"></div>
  </div></div>`;
  document.getElementById('wr-section-this').innerHTML=wrRenderSection('this');
  document.getElementById('wr-section-next').innerHTML=wrRenderSection('next');
  document.getElementById('wr-section-etc').innerHTML=wrRenderEtcSection();
  document.querySelectorAll('#wr-view textarea').forEach(t=>wrAutoGrow(t));
}

function wrOpenSearch(){
  document.getElementById('wr-search-modal').innerHTML=`
    <div class="m-head"><div class="m-date">지난 보고 검색</div></div>
    <div class="m-body">
      <div class="wr-search-input-row">
        <input type="text" id="wr-search-input" placeholder="검색어 입력 (예: PD시험, SKB 등)" onkeydown="if(event.key==='Enter')wrDoSearch()">
        <button class="wr-search-do-btn" onclick="wrDoSearch()">검색</button>
      </div>
      <div id="wr-search-results"><div class="wr-search-hint">검색어를 입력하세요</div></div>
    </div>
    <div class="m-foot"><div class="left"></div><button class="ghost" onclick="wrCloseSearch()">닫기</button></div>`;
  document.getElementById('wr-search-scrim').classList.add('show');
  setTimeout(()=>{const el=document.getElementById('wr-search-input');if(el)el.focus();},50);
}
function wrCloseSearch(){document.getElementById('wr-search-scrim').classList.remove('show');}
function wrFindSnippet(payload,kwLower){
  let snippet='';
  const scanGroups=(groups)=>{
    (groups||[]).forEach(g=>{
      if(!snippet && (g.name||'').toLowerCase().includes(kwLower)) snippet=g.name;
      (g.items||[]).forEach(it=>{
        if(!snippet && (it.text||'').toLowerCase().includes(kwLower)) snippet=it.text;
      });
    });
  };
  scanGroups(payload.thisGroups);
  scanGroups(payload.nextGroups);
  if(!snippet)(payload.etc||[]).forEach(e=>{ if(!snippet && (e||'').toLowerCase().includes(kwLower)) snippet=e; });
  return snippet;
}
async function wrDoSearch(){
  const kw=(document.getElementById('wr-search-input').value||'').trim();
  const resultsEl=document.getElementById('wr-search-results');
  if(!kw){resultsEl.innerHTML='<div class="wr-search-hint">검색어를 입력하세요</div>';return;}
  resultsEl.innerHTML='<div class="wr-search-hint">검색 중…</div>';
  const {data:rows}=await sb.from('weekly_reports').select('week_start,payload').order('week_start',{ascending:false});
  const kwLower=kw.toLowerCase();
  const matches=[];
  (rows||[]).forEach(r=>{
    const text=JSON.stringify(r.payload||{}).toLowerCase();
    if(text.includes(kwLower)){
      matches.push({weekStart:r.week_start,label:wrWeekHeaderLabel(r.week_start),snippet:wrFindSnippet(r.payload||{},kwLower)});
    }
  });
  if(matches.length===0){resultsEl.innerHTML='<div class="wr-search-hint">일치하는 결과가 없어요.</div>';return;}
  resultsEl.innerHTML=matches.map(m=>`<div class="wr-search-item" onclick="wrJumpToWeek('${m.weekStart}')"><b>${esc(m.label)}</b>${m.snippet?`<div class="wr-search-snippet">${esc(m.snippet)}</div>`:''}</div>`).join('');
}
async function wrJumpToWeek(weekStart){
  const ok=await wrFlushPendingSave();
  if(!ok && !confirm('방금 입력한 내용을 저장하지 못했어요. 그래도 이동할까요? (지금 입력한 내용은 저장 안 돼요)'))return;
  wrWeekStart=weekStart;
  await wrLoadReport(weekStart);
  wrCloseSearch();
  wrRenderShell();
}
document.getElementById('wr-search-scrim').addEventListener('click',ev=>{if(ev.target.id==='wr-search-scrim')wrCloseSearch();});
function wrCell(v,s){return {v:(v==null?'':String(v)),t:'s',s};}
function wrExportExcel(){
  if(typeof XLSX==='undefined'){alert('엑셀 내보내기 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해주세요.');return;}
  const THIN={style:'thin',color:{rgb:'B7B7B7'}};
  const MED={style:'medium',color:{rgb:'3A3A3A'}};
  const sTitle={font:{bold:true,sz:18},alignment:{horizontal:'center',vertical:'center'}};
  const sHead={font:{bold:true,sz:12,color:{rgb:'1F4E5F'}},fill:{fgColor:{rgb:'DCEEF0'}},alignment:{vertical:'center'}};
  const sCat={font:{bold:true,sz:11},fill:{fgColor:{rgb:'F3F6F7'}},alignment:{vertical:'center'}};
  const sItem={font:{sz:11},alignment:{vertical:'center',wrapText:true}};
  const sSched={font:{sz:11},alignment:{horizontal:'center',vertical:'center'}};

  const rows=[]; const headRowIdx=[];
  rows.push([wrCell('주간업무보고',sTitle),wrCell('',sTitle)]);
  headRowIdx.push(rows.length-1);
  rows.push([wrCell('금주의 업무 : '+wrReport.thisLabel,sHead),wrCell('일정',sHead)]);
  headRowIdx.push(rows.length-1);
  wrReport.thisGroups.forEach(g=>{
    rows.push([wrCell(g.name,sCat),wrCell('',sCat)]);
    g.items.forEach(it=>{ rows.push([wrCell('- '+(it.text||''),sItem),wrCell(it.sched||'',sSched)]); });
  });
  rows.push([wrCell('차주 업무 계획 : '+wrReport.nextLabel,sHead),wrCell('',sHead)]);
  headRowIdx.push(rows.length-1);
  wrReport.nextGroups.forEach(g=>{
    rows.push([wrCell(g.name,sCat),wrCell('',sCat)]);
    g.items.forEach(it=>{ rows.push([wrCell('- '+(it.text||''),sItem),wrCell(it.sched||'',sSched)]); });
  });
  rows.push([wrCell('기타 업무 공유 내용 (출장/불량 등)',sHead),wrCell('',sHead)]);
  headRowIdx.push(rows.length-1);
  wrReport.etc.forEach((val,i)=>{ rows.push([wrCell((i+1)+') '+(val||''),sItem),wrCell('',sItem)]); });

  const lastR=rows.length-1;
  const headSet=new Set(headRowIdx);
  rows.forEach((row,r)=>{
    row.forEach((cell,c)=>{
      const top = (r===0 || headSet.has(r)) ? MED : THIN;
      const bottom = (r===lastR || headSet.has(r) || headSet.has(r+1)) ? MED : THIN;
      const left = (c===0) ? MED : THIN;
      const right = (c===1) ? MED : THIN;
      cell.s = Object.assign({},cell.s,{border:{top,bottom,left,right}});
    });
  });

  const ws={};
  const range={s:{r:0,c:0},e:{r:lastR,c:1}};
  rows.forEach((row,r)=>{
    row.forEach((cell,c)=>{
      const addr=XLSX.utils.encode_cell({r,c});
      ws[addr]=cell;
    });
  });
  ws['!ref']=XLSX.utils.encode_range(range);
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:1}}];
  ws['!cols']=[{wch:62},{wch:14}];
  ws['!rows']=rows.map((_,i)=>i===0?{hpt:26}:{hpt:20});

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'주간업무보고');
  const fname=`주간업무보고_${wrReport.weekStart}.xlsx`;
  XLSX.writeFile(wb,fname);
}

(function(){loadTheme();applyTheme();initAuth();})();
</script>
