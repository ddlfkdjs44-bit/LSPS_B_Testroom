let memoSaveT=null, personalMemoSaveT=null, memoMode='team', autoNum=false, personalMemo='';
function toggleAutoNum(){autoNum=!autoNum;memoState.memoAutoNum=autoNum;memoSoftSave();const b=document.getElementById('autonum-btn');if(b)b.classList.toggle('on',autoNum);}
function memoNumKey(e){
  if(!autoNum)return;
  if(e.key!=='Enter'||e.shiftKey||e.isComposing||e.keyCode===229)return; // 한글 조합중이면 통과
  const ta=e.target;
  if(ta.selectionStart!==ta.selectionEnd)return;
  const val=ta.value, pos=ta.selectionStart;
  const lineStart=val.lastIndexOf('\n',pos-1)+1;
  let lineEnd=val.indexOf('\n',pos); if(lineEnd===-1)lineEnd=val.length;
  const curLine=val.slice(lineStart,lineEnd);
  const m=curLine.match(/^(\s*)(\d+)([.)])(\s)/);
  if(!m)return; // 번호 줄이 아니면 일반 줄바꿈
  e.preventDefault();
  const rest=curLine.slice(m[0].length);
  let nv,np;
  if(rest.trim()===''){ nv=val.slice(0,lineStart)+val.slice(lineEnd); np=lineStart; } // 빈 번호 항목 → 목록 종료
  else{ const next=parseInt(m[2],10)+1; const ins='\n'+m[1]+next+m[3]+' '; nv=val.slice(0,pos)+ins+val.slice(pos); np=pos+ins.length; }
  ta.value=nv; ta.selectionStart=ta.selectionEnd=np;
  ta.dispatchEvent(new Event('input'));
}
function memoSoftSave(){
  const el=document.getElementById('memo-saved');if(el){el.textContent='저장 중…';el.classList.add('saving');}

    const e2=document.getElementById('memo-saved');if(e2){e2.textContent='저장됨';e2.classList.remove('saving');}

}

function updDateMemoCard(d,v){if(!memoState.dateMemos)memoState.dateMemos={};memoState.dateMemos[d]=v;memoSoftSave();}

function addDateMemo(){const inp=document.getElementById('dmemo-newdate');const d=(inp&&inp.value)||TODAY_STR;if(!memoState.dateMemos)memoState.dateMemos={};if(memoState.dateMemos[d]==null)memoState.dateMemos[d]='';memoSoftSave();renderNotesView();setTimeout(()=>{const el=document.querySelector('#dm-'+d+' .dmemo-ta');if(el){el.focus();el.scrollIntoView({block:'center',behavior:'smooth'});}},60);}

function addDaysYmd(s,n){const[y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+n);return ymd(dt);}
function weekStartMon(s){const[y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);const dow=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-dow);return ymd(dt);}
function weekRangeLabel(ws,we){const a=ws.split('-').map(Number),b=we.split('-').map(Number);const wd=x=>WD[new Date(x[0],x[1]-1,x[2]).getDay()];return `${a[1]}/${a[2]}(${wd(a)}) ~ ${b[1]}/${b[2]}(${wd(b)})`;}
function copyToClipboard(text,okMsg){const ok=()=>alert(okMsg);const fail=()=>{try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='-9999px';document.body.appendChild(ta);ta.focus();ta.select();const d=document.execCommand('copy');ta.remove();if(d){ok();return;}}catch(e){}alert('❌ 복사에 실패했어요. 다시 시도해 주세요.');};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok).catch(fail);}else fail();}
function copyWeekMemo(ws){
  const dm=memoState.dateMemos||{}, we=addDaysYmd(ws,6);
  const dates=Object.keys(dm).filter(d=>d>=ws&&d<=we&&(dm[d]||'').trim()).sort();
  if(!dates.length){alert('이 주에 작성된 메모가 없어요.');return;}
  const blocks=dates.map(d=>{const[y,mo,da]=d.split('-').map(Number);const wd=WD[new Date(y,mo-1,da).getDay()];return `[${mo}/${da} (${wd})]\n${(dm[d]||'').trim()}`;});
  const text=`📋 주간 업무 메모 (${weekRangeLabel(ws,we)})\n──────────────\n${blocks.join('\n\n')}`;
  copyToClipboard(text,`🚀 주간 메모(${dates.length}일치)가 복사되었습니다!\n원하는 곳에 Ctrl+V 하세요.`);
}
function memoDShort(s){const[y,m,d]=s.split('-').map(Number);return `${m}/${d}`;}
function memoDLong(s){const[y,m,d]=s.split('-').map(Number);return `${y}년 ${m}월 ${d}일 (${WD[new Date(y,m-1,d).getDay()]})`;}

/* ════════════════ 집계 (월별 프로젝트 건수·금액) ════════════════ */
let statY=new Date().getFullYear(), statM=new Date().getMonth();
let statSel=null; // 선택된 projectId 배열 (복수 체크). null=최초(전체 선택)
function statChipIds(){const ids=data.projects.map(p=>p.id);if(data.events.some(e=>!e.projectId))ids.push('__none');return ids;}
function statMatch(e){const pid=e.projectId||'__none';return statSel.includes(pid);}
function toggleStatSel(id){const i=statSel.indexOf(id);if(i>=0)statSel.splice(i,1);else statSel.push(id);renderStatsView();}
function statSelectAll(){const ids=statChipIds();statSel=ids.every(id=>statSel.includes(id))?[]:ids.slice();renderStatsView();}
function fmtWon(n){return (n||0).toLocaleString('ko-KR')+'원';}
function statsFor(y,m){
  const byProj={}; let count=0, amount=0;
  data.events.forEach(e=>{
    if(!statMatch(e))return;
    const d=parseD(e.date);
    if(d.getFullYear()!==y)return;
    if(m!=null&&d.getMonth()!==m)return;
    const pid=e.projectId||'__none';
    if(!byProj[pid])byProj[pid]={count:0,amount:0};
    byProj[pid].count++; count++;
    const pr=+e.price||0; byProj[pid].amount+=pr; amount+=pr;
  });
  return {byProj,count,amount};
}
function shiftStat(d){let mm=statM+d,yy=statY;while(mm<0){mm+=12;yy--;}while(mm>11){mm-=12;yy++;}statM=mm;statY=yy;renderStatsView();}
function statThisMonth(){const n=new Date();statY=n.getFullYear();statM=n.getMonth();renderStatsView();}
function goStatMonth(mm){statM=mm;renderStatsView();}
function renderStatsView(){
  const wrap=document.getElementById('main-panel');
  const chipIds=statChipIds();
  if(statSel===null)statSel=chipIds.slice();
  else statSel=statSel.filter(id=>chipIds.includes(id));
  const cur=statsFor(statY,statM);
  const rows=Object.keys(cur.byProj).map(pid=>({pid,...cur.byProj[pid]})).sort((a,b)=>b.count-a.count||b.amount-a.amount);
  const maxCount=Math.max(1,...rows.map(r=>r.count));
  const monthly=Array.from({length:12},(_,mm)=>statsFor(statY,mm).count);
  const maxMon=Math.max(1,...monthly);
  const yr=statsFor(statY,null);
  const isCurM=(statY===new Date().getFullYear()&&statM===new Date().getMonth());
  const projRows=rows.length?rows.map(r=>{
    const pj=proj(r.pid);
    const name=r.pid==='__none'?'프로젝트 없음':(pj?pj.name:'(삭제된 프로젝트)');
    const col=projColor(r.pid);
    const w=Math.round(r.count/maxCount*100);
    return `<div class="stats-row">
      <span class="stats-dot" style="background:${col}"></span>
      <span class="stats-name">${esc(name)}</span>
      <div class="stats-bar"><div class="stats-barfill" style="width:${w}%;background:${col}"></div></div>
      <span class="stats-cnt">${r.count}건</span>
      <span class="stats-amt ${r.amount>0?'':'empty'}">${r.amount>0?fmtWon(r.amount):'—'}</span>
    </div>`;}).join(''):(statSel.length===0?'<div class="stats-empty">선택된 프로젝트가 없어요. 위에서 프로젝트를 체크하세요.</div>':'<div class="stats-empty">이 달에 등록된 일정이 없어요.</div>');
  const months=monthly.map((c,mm)=>`<button class="stats-mon ${mm===statM?'on':''}" onclick="goStatMonth(${mm})"><span class="stats-monwrap"><span class="stats-monbar" style="height:${c?Math.max(6,Math.round(c/maxMon*100)):0}%"></span></span><span class="stats-monn">${c}</span><span class="stats-monl">${mm+1}월</span></button>`).join('');
  const noneExists=data.events.some(e=>!e.projectId);
  const allSel=chipIds.length>0&&chipIds.every(id=>statSel.includes(id));
  const projChip=(id,name,color)=>`<button class="chip statchip ${statSel.includes(id)?'on':''}" onclick="toggleStatSel('${id}')"><span class="stats-check">${statSel.includes(id)?'✓':''}</span><span class="dot" style="background:${color}"></span>${esc(name)}</button>`;
  const filterChips=`<div class="stats-filter">
    <button class="chip statall ${allSel?'on':''}" onclick="statSelectAll()">전체</button>
    ${data.projects.map(p=>projChip(p.id,p.name,projColor(p.id))).join('')}
    ${noneExists?projChip('__none','프로젝트 없음','#999'):''}
  </div>`;
  const filterLabel=allSel?'전체':(statSel.length===0?'선택 없음':(statSel.length===1?((statSel[0]==='__none'?'프로젝트 없음':(proj(statSel[0])||{}).name)||'프로젝트'):`선택 ${statSel.length}개`));
  wrap.innerHTML=`<div class="stats-wrap">
    <div class="stats-head">
      <div class="cal-title"><span class="mo">집계</span></div>
      <div class="lv-yearnav">
        <button onclick="shiftStat(-1)">‹</button>
        <span class="lv-yr">${statY}<i>년</i> ${statM+1}<i>월</i></span>
        <button onclick="shiftStat(1)">›</button>
        ${!isCurM?`<button class="lv-today" onclick="statThisMonth()">이번 달</button>`:''}
      </div>
    </div>
    ${filterChips}
    <div class="stats-sum">
      <div class="stats-sumcard"><span>이번 달 일정 · ${filterLabel}</span><b>${cur.count}<i>건</i></b></div>
      <div class="stats-sumcard ${cur.amount>0?'':'muted'}"><span>이번 달 금액</span><b>${cur.amount>0?fmtWon(cur.amount):'—'}</b></div>
    </div>
    <div class="stats-card">
      <div class="stats-h">프로젝트별 · ${statY}.${pad(statM+1)}</div>
      <div class="stats-list">${projRows}</div>
    </div>
    <div class="stats-card">
      <div class="stats-h">${statY}년 월별 건수 <span>· 연간 ${yr.count}건${yr.amount>0?` · ${fmtWon(yr.amount)}`:''}</span></div>
      <div class="stats-months">${months}</div>
    </div>
    <div class="lv-note">일정의 <b>시작일</b> 기준으로 그 달에 집계돼요(여러 날 일정은 시작한 달에 1건). 금액은 일정 모달의 <b>단가</b>를 합산합니다. 단가가 없는 일정은 건수에는 포함되고 금액은 0으로 처리돼요.</div>
  </div>`;
}

function renderCal(){

function renderWeek(weekStart,curMonth){
  const HEADER=26, BARH=isMobileCal()?36:22;
  const wsNum=dayNum(ymd(weekStart)), weNum=wsNum+6;
  let segs=[];
  data.events.forEach(e=>{
    if(!passProj(e))return;
    const s=dayNum(e.date),en=dayNum(dueOf(e));
    if(en<wsNum||s>weNum)return;
    segs.push({e,startCol:Math.max(0,s-wsNum),endCol:Math.min(6,en-wsNum),contL:s<wsNum,contR:en>weNum});
  });
  segs.sort((a,b)=>a.startCol-b.startCol||(b.endCol-b.startCol)-(a.endCol-a.startCol)||a.e.date.localeCompare(b.e.date));
  const lanes=[];
  segs.forEach(sg=>{let placed=false;for(let i=0;i<lanes.length;i++){if(lanes[i].every(o=>sg.endCol<o.s||sg.startCol>o.e)){lanes[i].push({s:sg.startCol,e:sg.endCol});sg.lane=i;placed=true;break;}}if(!placed){sg.lane=lanes.length;lanes.push([{s:sg.startCol,e:sg.endCol}]);}});
  const shown=Math.min(lanes.length,MAXL);
  const h=Math.max(94,HEADER+shown*BARH+10);
  const hidden=Array(7).fill(0);
  segs.forEach(sg=>{if(sg.lane>=MAXL)for(let c=sg.startCol;c<=sg.endCol;c++)hidden[c]++;});
  let cells='';
  for(let c=0;c<7;c++){
    const d=new Date(weekStart);d.setDate(weekStart.getDate()+c);
    const s=ymd(d),dow=d.getDay(),muted=d.getMonth()!==curMonth,isToday=s===TODAY_STR;
    const hol=HOLIDAYS[s];
    let dcls='';if(dow===0)dcls='sun';if(dow===6)dcls='sat';if(hol)dcls='hol';
    const holLbl=hol?`<span class="hol-lbl">${hol}</span>`:'';
    const moreTxt=hidden[c]>0?`<span class="more">+${hidden[c]}개</span>`:'';
    cells+=`<div class="cell ${muted?'muted':''} ${isToday?'today':''} ${hol?'holiday':''}" style="min-height:${h}px" onclick="newEvent('${s}')"><span class="dnum ${dcls}">${d.getDate()}</span>${isToday?'<span class="today-badge">오늘!</span>':''}${holLbl}${moreTxt}</div>`;
  }
  let bars='';
  segs.filter(sg=>sg.lane<MAXL).forEach(sg=>{
    const n=sg.endCol-sg.startCol+1;
    const left=`calc((100% - ${6*GAP}px)/7 * ${sg.startCol} + ${sg.startCol*GAP}px)`;
    const width=`calc((100% - ${6*GAP}px)/7 * ${n} + ${(n-1)*GAP}px - 2px)`;
    const top=HEADER+sg.lane*BARH;
    const tot=(sg.e.todos||[]).length,done=(sg.e.todos||[]).filter(t=>t.status==='done').length;
    const allDone=tot>0&&done===tot;
    const bc=tot?`<span class="bc">${done}/${tot}</span>`:'';
    const cls=`ebar ${sg.contL?'contL':''} ${sg.contR?'contR':''} ${allDone?'alldone':''}`;
    const label=(sg.contL&&sg.startCol===0?'‹ ':'')+esc(sg.e.title||'(제목 없음)')+(sg.contR?' ›':'');
    bars+=`<div class="${cls}" style="left:${left};width:${width};top:${top}px;background:${projColor(sg.e.projectId)}" onclick="event.stopPropagation();openEvent('${sg.e.id}')">${bc}${label}</div>`;
  });
  return `<div class="week">${cells}<div class="bars">${bars}</div></div>`;
}
function shift(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);renderCal();}
function goToday(){view=new Date();renderCal();}
/* ── 캘린더 이미지(PNG) 저장 / 공유 : 화면을 그대로 캔버스에 그림 (외부 라이브러리 없음) ── */

function buildCalCanvasWide(){

  let cursor=new Date(y,m,1); cursor.setDate(1-firstDow);
  const lastDay=new Date(y,m+1,0);
  const CELLW=176, GAP=8, HEADER=32, BARH=28, MAXLW=4;
  const weeks=[];
  while(cursor<=lastDay){
    const weekStart=new Date(cursor);
    const wsNum=dayNum(ymd(weekStart)), weNum=wsNum+6;
    const segs=[];
    data.events.forEach(e=>{
      if(!passProj(e))return;
      const s=dayNum(e.date), en=dayNum(dueOf(e));
      if(en<wsNum||s>weNum)return;
      segs.push({e,startCol:Math.max(0,s-wsNum),endCol:Math.min(6,en-wsNum),contL:s<wsNum,contR:en>weNum});
    });
    segs.sort((a,b)=>a.startCol-b.startCol||(b.endCol-b.startCol)-(a.endCol-a.startCol)||a.e.date.localeCompare(b.e.date));
    const lanes=[];
    segs.forEach(sg=>{let placed=false;for(let i=0;i<lanes.length;i++){if(lanes[i].every(o=>sg.endCol<o.s||sg.startCol>o.e)){lanes[i].push({s:sg.startCol,e:sg.endCol});sg.lane=i;placed=true;break;}}if(!placed){sg.lane=lanes.length;lanes.push([{s:sg.startCol,e:sg.endCol}]);}});
    const shown=Math.min(lanes.length,MAXLW);
    const h=Math.max(78,HEADER+shown*BARH+10);
    const hidden=Array(7).fill(0);
    segs.forEach(sg=>{if(sg.lane>=MAXLW)for(let c=sg.startCol;c<=sg.endCol;c++)hidden[c]++;});
    weeks.push({weekStart,segs,hidden,h});
    cursor.setDate(cursor.getDate()+7);
  }
  const PAD=22, TITLEH=44, WKH=32;
  const totalW=CELLW*7+GAP*6;
  const totalH=weeks.reduce((a,w)=>a+w.h+GAP,0)-GAP;
  const scale=2;
  const cv=document.createElement('canvas');
  cv.width=Math.ceil((totalW+PAD*2)*scale);
  cv.height=Math.ceil((totalH+PAD*2+TITLEH+WKH)*scale);
  const ctx=cv.getContext('2d'); ctx.scale(scale,scale);
  const FONT="'Pretendard','Malgun Gothic',sans-serif";
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,totalW+PAD*2,totalH+PAD*2+TITLEH+WKH);

  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  ctx.fillStyle='#1a1a1a'; ctx.font=`700 26px ${FONT}`;
  ctx.fillText(`${m+1}월`, PAD, PAD+27);
  const moW=ctx.measureText(`${m+1}월`).width;
  ctx.fillStyle='#9aa0a6'; ctx.font=`15px 'IBM Plex Mono',monospace`;
  ctx.fillText(String(y), PAD+moW+9, PAD+27);

  ctx.textAlign='center';
  WD.forEach((w,i)=>{
    const cx=PAD+i*(CELLW+GAP)+CELLW/2;
    ctx.fillStyle= i===0?'#d2543a': i===6?'#0e6b73':'#666';
    ctx.font=`600 13px ${FONT}`;
    ctx.fillText(w, cx, PAD+TITLEH+21);
  });

  let y0=PAD+TITLEH+WKH;
  weeks.forEach(wk=>{
    for(let c=0;c<7;c++){
      const d=new Date(wk.weekStart); d.setDate(wk.weekStart.getDate()+c);
      const s=ymd(d), dow=d.getDay(), muted=d.getMonth()!==m, isToday=s===TODAY_STR;
      const hol=HOLIDAYS[s];
      const x=PAD+c*(CELLW+GAP), yy=y0;
      ctx.fillStyle= isToday? '#e8f4f3':'#fbfbfc';
      ctx.fillRect(x,yy,CELLW,wk.h);
      ctx.strokeStyle='#e6e6e6'; ctx.lineWidth=1; ctx.strokeRect(x+.5,yy+.5,CELLW-1,wk.h-1);
      ctx.textAlign='left';
      ctx.fillStyle = muted? '#c7cbd1' : (hol||dow===0? '#d2543a' : dow===6? '#0e6b73' : '#1a1a1a');
      ctx.font=`700 15px 'IBM Plex Mono',monospace`;
      ctx.fillText(String(d.getDate()), x+10, yy+22);
      if(hol){
        ctx.font=`600 10px ${FONT}`;
        const tw=ctx.measureText(hol).width;
        ctx.fillStyle='#fbe9e6';
        rrect(ctx,x+CELLW-tw-16,yy+8,tw+10,17,4); ctx.fill();
        ctx.fillStyle='#c0392b';
        ctx.fillText(hol, x+CELLW-tw-11, yy+19.5);
      }
      if(wk.hidden[c]>0){
        ctx.fillStyle='#888'; ctx.font=`10px ${FONT}`; ctx.textAlign='right';
        ctx.fillText(`+${wk.hidden[c]}개`, x+CELLW-8, yy+wk.h-8);
        ctx.textAlign='left';
      }
    }
    wk.segs.filter(sg=>sg.lane<MAXLW).forEach(sg=>{
      const n=sg.endCol-sg.startCol+1;
      const x=PAD+sg.startCol*(CELLW+GAP);
      const w=CELLW*n+GAP*(n-1)-4;
      const yb=y0+HEADER+sg.lane*BARH;
      ctx.fillStyle=projColor(sg.e.projectId);
      rrect(ctx,x+2,yb,w,BARH-6,5); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font=`600 13px ${FONT}`;
      ctx.textAlign='left';
      const label=(sg.contL&&sg.startCol===0?'‹ ':'')+(sg.e.title||'(제목 없음)')+(sg.contR?' ›':'');
      ctx.fillText(label, x+11, yb+(BARH-6)/2+4.5, w-20);
    });
    y0+=wk.h+GAP;
  });
  return cv;
}
function buildCalCanvas(){
  const title=document.querySelector('.cal-title'), wkd=document.querySelector('.weekdays'), body=document.querySelector('.cal-body');
  if(!wkd||!body)return null;
  const wkR=wkd.getBoundingClientRect(), bdR=body.getBoundingClientRect();
  const PAD=18, TITLEH=46, scale=2;
  const originX=Math.min(wkR.left,bdR.left), originY=wkR.top;
  const W=Math.max(wkR.width,bdR.width), H=(bdR.bottom-wkR.top);
  const cv=document.createElement('canvas');
  cv.width=Math.ceil((W+PAD*2)*scale); cv.height=Math.ceil((H+PAD*2+TITLEH)*scale);
  const ctx=cv.getContext('2d'); ctx.scale(scale,scale);
  const mapX=x=>x-originX+PAD, mapY=y=>y-originY+PAD+TITLEH;
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W+PAD*2,H+PAD*2+TITLEH);
  // 제목
  const mo=document.querySelector('.cal-title .mo'), yr=document.querySelector('.cal-title .yr');
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  if(mo){ctx.fillStyle=getComputedStyle(mo).color;ctx.font=fontOf(mo,'24px');ctx.fillText(mo.textContent,PAD,PAD+27);}
  const moW=mo?ctx.measureText(mo.textContent).width:0;
  if(yr){ctx.fillStyle=getComputedStyle(yr).color;ctx.font=fontOf(yr,'15px');ctx.fillText(yr.textContent,PAD+moW+8,PAD+27);}
  // 요일 헤더
  ctx.textAlign='center';
  wkd.querySelectorAll(':scope>div').forEach(dc=>{const r=dc.getBoundingClientRect();ctx.fillStyle=getComputedStyle(dc).color;ctx.font=fontOf(dc,'12px');ctx.fillText(dc.textContent,mapX(r.left+r.width/2),mapY(r.top+r.height/2)+4);});
  // 셀
  body.querySelectorAll('.cell').forEach(cell=>{
    const r=cell.getBoundingClientRect(), x=mapX(r.left), y=mapY(r.top), w=r.width, hh=r.height, cs=getComputedStyle(cell);
    const bg=cs.backgroundColor; ctx.fillStyle=(bg&&bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent')?bg:'#ffffff'; ctx.fillRect(x,y,w,hh);
    ctx.strokeStyle='#e6e6e6'; ctx.lineWidth=1; ctx.strokeRect(x+.5,y+.5,w-1,hh-1);
    const dn=cell.querySelector('.dnum');
    if(dn){const dr=dn.getBoundingClientRect();ctx.fillStyle=getComputedStyle(dn).color;ctx.font=fontOf(dn,'12px');ctx.textAlign='left';ctx.fillText(dn.textContent,mapX(dr.left),mapY(dr.top)+11);}
    const hl=cell.querySelector('.hol-lbl');
    if(hl){const hr=hl.getBoundingClientRect();ctx.fillStyle=getComputedStyle(hl).color;ctx.font=fontOf(hl,'9px');ctx.textAlign='left';ctx.fillText(hl.textContent,mapX(hr.left),mapY(hr.top)+9);}
    const mr=cell.querySelector('.more');
    if(mr){const rr=mr.getBoundingClientRect();ctx.fillStyle=getComputedStyle(mr).color;ctx.font=fontOf(mr,'9px');ctx.textAlign='right';ctx.fillText(mr.textContent,mapX(rr.right),mapY(rr.top)+10);}
  });
  // 일정 바
  body.querySelectorAll('.ebar').forEach(bar=>{
    const r=bar.getBoundingClientRect(), x=mapX(r.left), y=mapY(r.top), w=r.width, hh=r.height;
    ctx.fillStyle=getComputedStyle(bar).backgroundColor; rrect(ctx,x,y,w,hh,4); ctx.fill();
    const bc=bar.querySelector('.bc'); const bcT=bc?bc.textContent.trim():''; let full=bar.textContent; let titleT=bcT?full.slice(bcT.length):full;
    const txt=(bcT?bcT+' ':'')+titleT.trim();
    ctx.save(); rrect(ctx,x,y,w,hh,4); ctx.clip();
    ctx.fillStyle='#ffffff'; ctx.font=fontOf(bar,'11px'); ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(txt,x+6,y+hh/2+.5); ctx.restore(); ctx.textBaseline='alphabetic';
  });
  return cv;
}
function calImgName(){const mo=document.querySelector('.cal-title .mo'),yr=document.querySelector('.cal-title .yr');return `캘린더_${(yr?yr.textContent:'').trim()}_${(mo?mo.textContent:'').trim()}.png`.replace(/\s+/g,'');}

function shareCalImage(){

/* ⚡ 금일 업무 보고 복사 ── 오늘 걸쳐 있는 일정을 상태별로 모아 메신저용 텍스트로 복사 */
function reportState(e){
  // 금일 보고: 할일이 전부 '완료'면 완료, 그 외(할일 없음·일부 진행·전부 미착수)는 모두 진행 중
  const todos=e.todos||[];
  if(todos.length&&todos.every(t=>t.status==='done'))return 'done';
  return 'doing';
}
function copyTodayReport(){
  // 오늘(TODAY_STR)이 시작~종료 사이에 포함되는 일정 필터링
  const todays=data.events.filter(e=>{
    const a=dayNum(e.date), b=dayNum(e.endDate||e.date);
    return TODAY_NUM>=a && TODAY_NUM<=b;
  });
  if(!todays.length){alert('📢 오늘 날짜로 등록된 업무나 할 일이 없습니다.');return;}
  // 상태별 분류
  const groups={done:[],doing:[],todo:[]};
  todays.forEach(e=>{
    const p=proj(e.projectId);
    const title=(e.title||'').trim()||'(제목 없음)';
    const line=p?`- [${p.name}] ${title}`:`- ${title}`;
    (groups[reportState(e)]||groups.todo).push(line);
  });
  // 날짜 + 요일
  const [y,m,d]=TODAY_STR.split('-');
  const dow=WD[new Date(+y,+m-1,+d).getDay()];
  const bar='==================================';
  const sections=[];
  if(groups.done.length) sections.push('✅ 완료된 업무\n'+groups.done.join('\n'));
  if(groups.doing.length)sections.push('⏳ 진행 중인 업무\n'+groups.doing.join('\n'));
  if(groups.todo.length) sections.push('📋 예정/보류 업무\n'+groups.todo.join('\n'));
  const text=`📢 [${y}.${m}.${d} (${dow})] 금일 업무 보고\n${bar}\n${sections.join('\n')}\n${bar}\n(본 내용은 업무 일정 관리 앱에서 복사되었습니다.)`;
  const n=todays.length;
  const ok=()=>alert(`🚀 오늘 업무(${n}건)가 메신저용으로 복사되었습니다!\n원하는 창에 Ctrl+V 하세요.`);
  const fail=()=>{
    // navigator.clipboard 미지원/거부 시 폴백
    try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='-9999px';document.body.appendChild(ta);ta.focus();ta.select();const done=document.execCommand('copy');ta.remove();if(done){ok();return;}}catch(e){}
    alert('❌ 복사에 실패했습니다. 브라우저 클립보드 권한을 확인하거나 다시 시도해 주세요.');
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok).catch(fail);}
  else fail();
}
function importData(input){if(!isLeader()){alert('팀원 계정은 가져오기를 할 수 없어요.');input.value='';return;}const f=input.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const parsed=JSON.parse(rd.result);if(!parsed||!Array.isArray(parsed.events))throw 0;if(!confirm(`백업 파일을 불러오면 현재 데이터를 덮어씁니다.\n일정 ${parsed.events.length}건을 불러올까요?`)){input.value='';return;}data=parsed;migrate();save();renderAll();alert('불러오기 완료.');}catch(e){alert('불러오기 실패: 올바른 백업 파일이 아니에요.');}input.value='';};rd.readAsText(f);}

function qcNextNo(){

async function qcLoadData(){
  const {data:rows}=await sb.from('qc_tracker_data').select('id,payload').order('updated_at',{ascending:true});
  if(!rows||rows.length===0){
    qcActiveId='main';

    qcProjects=[{id:'main',name:'(이름 없음)'}];
    await sb.from('qc_tracker_data').insert({id:'main',payload:{columns:qcColumns,units:qcUnits,project:qcProject}});
    return;
  }
  qcProjects=rows.map(r=>({id:r.id,name:(r.payload&&r.payload.project&&r.payload.project.name)||'(이름 없음)'}));
  let saved=null;
  try{saved=localStorage.getItem('qc-active-project-id');}catch(e){}
  const target=rows.find(r=>r.id===saved)||rows[0];
  qcActiveId=target.id;
  qcApplyPayload(target.payload);
}
async function qcSave(){
  lastSelfQcSaveAt=Date.now();
  await sb.from('qc_tracker_data').update({payload:{columns:qcColumns,units:qcUnits,project:qcProject},updated_by:profile.id,updated_at:new Date().toISOString()}).eq('id',qcActiveId);
  const p=qcProjects.find(x=>x.id===qcActiveId);
  if(p)p.name=(qcProject.name&&qcProject.name.trim())||'(이름 없음)';
}
async function qcSwitchProject(id,skipSaveCurrent){
  if(id===qcActiveId||!id)return;
  if(!skipSaveCurrent)await qcSave();
  const {data:row}=await sb.from('qc_tracker_data').select('payload').eq('id',id).maybeSingle();
  qcActiveId=id;
  try{localStorage.setItem('qc-active-project-id',id);}catch(e){}
  qcApplyPayload(row&&row.payload);
  qcRender();
  qcRenderProjectSelect();
}
async function qcCreateProject(){
  const name=prompt('새 프로젝트 이름을 입력해줘 (나중에 바꿀 수 있어)','');
  if(name===null)return;
  await qcSave();
  const newId=uid();
  const newColumns=qcDefaultColumns();
  const newProject={name:name.trim()};
  await sb.from('qc_tracker_data').insert({id:newId,payload:{columns:newColumns,units:[],project:newProject}});
  qcProjects.push({id:newId,name:newProject.name||'(이름 없음)'});
  qcActiveId=newId;
  try{localStorage.setItem('qc-active-project-id',newId);}catch(e){}
  qcColumns=newColumns;qcUnits=[];qcProject=newProject;
  qcRender();
  qcRenderProjectSelect();
}
async function qcDeleteProject(id){
  if(qcProjects.length<=1){alert('마지막 남은 프로젝트는 삭제할 수 없어. 내용을 비우려면 "전체 초기화"를 써줘.');return;}
  const p=qcProjects.find(x=>x.id===id);
  if(!confirm(`"${p?p.name:''}" 프로젝트를 목록에서 완전히 삭제할까? 되돌릴 수 없어.`))return;
  await sb.from('qc_tracker_data').delete().eq('id',id);
  qcProjects=qcProjects.filter(x=>x.id!==id);
  if(qcActiveId===id)await qcSwitchProject(qcProjects[0].id,true);
  else qcRenderProjectSelect();
}
function qcRenderProjectSelect(){
  const sel=document.getElementById('qcProjectSelect');
  if(!sel)return;
  sel.innerHTML=qcProjects.map(p=>`<option value="${p.id}" ${p.id===qcActiveId?'selected':''}>${esc(p.name||'(이름 없음)')}</option>`).join('');
}

let qcNoteTarget=null;
function qcOpenNote(unitId,colId){
  qcNoteTarget={unitId,colId};
  const u=qcUnits.find(x=>x.id===unitId);
  const col=qcColumns.find(x=>x.id===colId);
  const val=(u&&u.notes&&u.notes[colId])||'';
  document.getElementById('qcnote-modal').innerHTML=`
    <div class="m-head"><div class="m-date">${esc(u?u.no:'')}호기 · ${esc(col?col.name:'')} 메모</div></div>
    <div class="m-body"><textarea id="qcnote-text" class="m-memo" placeholder="시험 중 특이사항, 재확인할 내용 등을 적어줘" style="width:100%;min-height:130px;">${esc(val)}</textarea></div>
    <div class="m-foot"><div class="left">${val?'<button class="ghost" onclick="qcDeleteNote()">메모 삭제</button>':''}</div><button class="done-btn" onclick="qcSaveNote()">저장</button></div>`;
  document.getElementById('qcnote-scrim').classList.add('show');
}
function qcCloseNote(){document.getElementById('qcnote-scrim').classList.remove('show');qcNoteTarget=null;}
async function qcSaveNote(){
  if(!qcNoteTarget)return;
  const {unitId,colId}=qcNoteTarget;
  const u=qcUnits.find(x=>x.id===unitId);
  if(!u)return;
  if(!u.notes)u.notes={};
  const text=document.getElementById('qcnote-text').value.trim();
  if(text)u.notes[colId]=text; else delete u.notes[colId];
  await qcSave();
  qcCloseNote();
  qcRender();
}
async function qcDeleteNote(){
  if(!qcNoteTarget)return;
  const {unitId,colId}=qcNoteTarget;
  const u=qcUnits.find(x=>x.id===unitId);
  if(u&&u.notes)delete u.notes[colId];
  await qcSave();
  qcCloseNote();
  qcRender();
}
document.getElementById('qcnote-scrim').addEventListener('click',ev=>{if(ev.target.id==='qcnote-scrim')qcCloseNote();});
async function qcLoadArchive(){
  const {data:rows}=await sb.from('qc_tracker_archive').select('*').order('saved_at',{ascending:false});
  return (rows||[]).map(r=>({id:r.id,savedAt:r.saved_at,name:r.name,columns:(r.payload&&r.payload.columns)||[],units:(r.payload&&r.payload.units)||[]}));
}
async function qcSaveAndReset(){
  if(qcUnits.length===0 && !qcProject.name.trim()){alert('저장할 내용이 없어.');return;}
  if(!confirm('현재 프로젝트를 완료 처리해서 "지난 기록"으로 옮길까? 활성 목록에서는 사라져.'))return;
  const label=qcProject.name.trim()||('프로젝트 '+new Date().toLocaleString('ko-KR'));
  await sb.from('qc_tracker_archive').insert({name:label,payload:{columns:JSON.parse(JSON.stringify(qcColumns)),units:JSON.parse(JSON.stringify(qcUnits))}});
  const doneId=qcActiveId;
  await sb.from('qc_tracker_data').delete().eq('id',doneId);
  qcProjects=qcProjects.filter(p=>p.id!==doneId);
  if(qcProjects.length===0){
    const newId=uid();
    qcColumns=qcDefaultColumns();qcUnits=[];qcProject={name:''};
    await sb.from('qc_tracker_data').insert({id:newId,payload:{columns:qcColumns,units:qcUnits,project:qcProject}});
    qcActiveId=newId;
    qcProjects=[{id:newId,name:'(이름 없음)'}];
    try{localStorage.setItem('qc-active-project-id',newId);}catch(e){}
  }else{
    qcActiveId=null; // 삭제된 프로젝트로 스킵 저장되지 않도록
    await qcSwitchProject(qcProjects[0].id,true);
    return;
  }
  qcRender();
  qcRenderProjectSelect();
}
function qcVisibleColumns(){
  if(qcFilterCat==='all')return qcColumns.map((c,i)=>({...c,idx:i}));
  return qcColumns.map((c,i)=>({...c,idx:i})).filter(c=>c.category===qcFilterCat);
}
function qcIsEffDone(u,ci){
  if((u.tests[ci]||0)===1)return true;
  const col=qcColumns[ci];
  if(col&&col.category==='type'){
    const cap=(u.capacity||'').trim();
    if(cap)return qcUnits.some(o=>o.id!==u.id&&(o.capacity||'').trim()===cap&&(o.tests[ci]||0)===1);
  }
  return false;
}

function qcRender(){
  document.getElementById('qcProjName').value=qcProject.name;
  const cols=qcVisibleColumns();
  const headRow=document.getElementById('qcHeadRow'),bodyRows=document.getElementById('qcBodyRows'),footRow=document.getElementById('qcFootRow');
  headRow.innerHTML='<th class="corner corner-no">호기</th><th class="corner corner-cap">용량</th>'+
    cols.map(c=>`<th class="colname ${c.category}"><span class="lbl">${esc(c.name)}</span></th>`).join('')+
    '<th class="progresshead">완료</th>';
  const totalCols=qcColumns.length;
  if(qcUnits.length===0){
    bodyRows.innerHTML=`<tr><td class="empty-msg" colspan="${cols.length+3}">등록된 호기가 없어. 상단에서 호기를 추가하거나 목록을 붙여넣어줘.</td></tr>`;
  }else{
    bodyRows.innerHTML=qcUnits.map(u=>{
      const done=qcColumns.reduce((acc,_,ci)=>acc+(qcIsEffDone(u,ci)?1:0),0);
      const complete=totalCols>0&&done===totalCols;
      const cells=cols.map(c=>{
        const own=u.tests[c.idx]||0;
        let cls='',mark='',dotStyle='background:#414f68 !important;border-color:#5a6883 !important;color:#f2f4f8 !important;';
        if(own===1){cls='done';dotStyle='background:#43d68a !important;border-color:#43d68a !important;color:#0e2417 !important;';}
        else if(qcIsEffDone(u,c.idx)){cls='exempt';mark='×';dotStyle='background:transparent !important;border:1px dashed #f0bb52 !important;color:#f0bb52 !important;';}
        const hasNote=!!(u.notes&&u.notes[c.id]&&u.notes[c.id].trim());
        const noteMark=`<span class="note-mark ${hasNote?'has-note':''}" data-uid="${u.id}" data-cid="${c.id}" title="${hasNote?'메모 있음 — 클릭해서 보기':'클릭해서 메모 추가'}"></span>`;
        return `<td class="qccell ${cls} ${c.category==='type'?'typecol':''}" data-uid="${u.id}" data-ci="${c.idx}"><div class="dot" style="${dotStyle}">${mark}</div>${noteMark}</td>`;
      }).join('');
      return `<tr class="${complete?'complete':''}">
        <th class="rowno"><input type="text" value="${esc(u.no)}" data-uid="${u.id}" class="qcNoInput" style="background:transparent !important;color:#f2f4f8 !important;"></th>
        <th class="rowname"><div class="row-inner"><input type="text" value="${esc(u.capacity)}" data-uid="${u.id}" class="qcCapInput" placeholder="예: 2000kVA" list="qcCapList" style="background:transparent !important;color:#f2f4f8 !important;"><span class="del" data-uid="${u.id}" title="삭제">×</span></div></th>
        ${cells}
        <td class="progress">${done}/${totalCols}</td>
      </tr>`;
    }).join('');
  }
  const totalUnits=qcUnits.length;
  footRow.innerHTML='<th class="corner" colspan="2">항목별 완료</th>'+
    cols.map(c=>{
      const cnt=qcUnits.filter(u=>qcIsEffDone(u,c.idx)).length;
      const full=totalUnits>0&&cnt===totalUnits;
      return `<td class="colsum ${full?'full':''}">${cnt}/${totalUnits}</td>`;
    }).join('')+'<td></td>';
  qcUpdateStats();
  qcBindRowEvents();
  qcRenderColManager();
  qcUpdateCapList();
}
function qcUpdateCapList(){
  const dl=document.getElementById('qcCapList');
  const uniq=[...new Set(qcUnits.map(u=>(u.capacity||'').trim()).filter(Boolean))];
  dl.innerHTML=uniq.map(v=>`<option value="${esc(v)}"></option>`).join('');
}
function qcUpdateStats(){
  const totalUnits=qcUnits.length,totalCols=qcColumns.length;
  const unitsDone=qcUnits.filter(u=>totalCols>0&&qcColumns.every((_,ci)=>qcIsEffDone(u,ci))).length;
  const totalCells=totalUnits*totalCols;
  const doneCells=qcUnits.reduce((acc,u)=>acc+qcColumns.reduce((a,_,ci)=>a+(qcIsEffDone(u,ci)?1:0),0),0);
  document.getElementById('qcStatUnitsDone').textContent=unitsDone;
  document.getElementById('qcStatUnitsTotal').textContent=totalUnits;
  document.getElementById('qcStatCellsDone').textContent=doneCells;
  document.getElementById('qcStatCellsTotal').textContent=totalCells;
  const pct=totalCells>0?Math.round(doneCells/totalCells*100):0;
  document.getElementById('qcRingPct').textContent=pct+'%';
  const circ=150.8;
  document.getElementById('qcRingFg').style.strokeDashoffset=circ-(circ*pct/100);
}
function qcBindRowEvents(){
  document.querySelectorAll('#qc-view .note-mark').forEach(el=>{
    el.addEventListener('click',(e)=>{
      e.stopPropagation();
      qcOpenNote(el.dataset.uid,el.dataset.cid);
    });
  });
  document.querySelectorAll('#qc-view td.qccell').forEach(td=>{
    td.onclick=()=>{
      const uid_=td.dataset.uid,ci=+td.dataset.ci;
      const u=qcUnits.find(x=>x.id===uid_);
      if(!u)return;
      u.tests[ci]=u.tests[ci]===1?0:1;
      qcSave();qcRender();
    };
  });
  document.querySelectorAll('#qc-view .qcNoInput').forEach(inp=>{
    inp.onchange=()=>{const u=qcUnits.find(x=>x.id===inp.dataset.uid);if(u){u.no=inp.value.trim();qcSave();qcRender();}};
  });
  document.querySelectorAll('#qc-view .qcCapInput').forEach(inp=>{
    inp.onchange=()=>{const u=qcUnits.find(x=>x.id===inp.dataset.uid);if(u){u.capacity=inp.value.trim();qcSave();qcRender();}};
  });
  document.querySelectorAll('#qc-view tbody .del').forEach(el=>{
    el.onclick=(e)=>{e.stopPropagation();if(!confirm('이 호기를 삭제할까?'))return;qcUnits=qcUnits.filter(u=>u.id!==el.dataset.uid);qcSave();qcRender();};
  });
}
function qcRenderColManager(){
  const list=document.getElementById('qcColList');
  if(qcColumns.length===0){list.innerHTML=`<div class="hint">등록된 시험 항목이 없어. 아래에서 추가해줘.</div>`;return;}
  list.innerHTML=qcColumns.map((c,i)=>`
    <div class="col-row" draggable="true" data-cid="${c.id}">
      <span class="handle" title="드래그해서 순서 변경">⠿</span>
      <span class="tag-dot ${c.category}"></span>
      <input type="text" value="${esc(c.name)}" data-cid="${c.id}" class="qcColNameInput">
      <select data-cid="${c.id}" class="qcColCatSelect"><option value="routine" ${c.category==='routine'?'selected':''}>루틴시험</option><option value="type" ${c.category==='type'?'selected':''}>타입시험</option></select>
      <div class="move-btns"><span class="move-btn ${i===0?'disabled':''}" data-cid="${c.id}" data-dir="up" title="위로">▲</span><span class="move-btn ${i===qcColumns.length-1?'disabled':''}" data-cid="${c.id}" data-dir="down" title="아래로">▼</span></div>
      <span class="del" data-cid="${c.id}" title="항목 삭제">×</span>
    </div>`).join('');
  list.querySelectorAll('.qcColNameInput').forEach(inp=>{
    inp.onchange=()=>{const c=qcColumns.find(x=>x.id===inp.dataset.cid);if(c){c.name=inp.value.trim()||c.name;qcSave();qcRender();}};
  });
  list.querySelectorAll('.qcColCatSelect').forEach(sel=>{
    sel.onchange=()=>{const c=qcColumns.find(x=>x.id===sel.dataset.cid);if(c){c.category=sel.value;qcSave();qcRender();}};
  });
  list.querySelectorAll('.del').forEach(el=>{
    el.onclick=()=>{
      if(!confirm('이 시험 항목을 삭제할까? 모든 호기의 해당 체크 데이터도 함께 삭제돼.'))return;
      const idx=qcColumns.findIndex(x=>x.id===el.dataset.cid);
      if(idx===-1)return;
      qcColumns.splice(idx,1);
      qcUnits.forEach(u=>u.tests.splice(idx,1));
      qcSave();qcRender();
    };
  });
  list.querySelectorAll('.move-btn').forEach(btn=>{
    btn.onclick=()=>{
      const idx=qcColumns.findIndex(x=>x.id===btn.dataset.cid);
      const dir=btn.dataset.dir==='up'?-1:1;
      const swapIdx=idx+dir;
      if(idx===-1||swapIdx<0||swapIdx>=qcColumns.length)return;
      [qcColumns[idx],qcColumns[swapIdx]]=[qcColumns[swapIdx],qcColumns[idx]];
      qcUnits.forEach(u=>{[u.tests[idx],u.tests[swapIdx]]=[u.tests[swapIdx],u.tests[idx]];});
      qcSave();qcRender();
    };
  });
  qcDragSrcId=null;
  list.querySelectorAll('.col-row').forEach(row=>{
    row.addEventListener('dragstart',(e)=>{qcDragSrcId=row.dataset.cid;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',qcDragSrcId);});
    row.addEventListener('dragend',()=>{row.classList.remove('dragging');list.querySelectorAll('.col-row').forEach(r=>r.classList.remove('drag-over-top','drag-over-bottom'));});
    row.addEventListener('dragover',(e)=>{e.preventDefault();if(!qcDragSrcId||row.dataset.cid===qcDragSrcId)return;const rect=row.getBoundingClientRect();const before=(e.clientY-rect.top)<rect.height/2;row.classList.toggle('drag-over-top',before);row.classList.toggle('drag-over-bottom',!before);});
    row.addEventListener('dragleave',()=>{row.classList.remove('drag-over-top','drag-over-bottom');});
    row.addEventListener('drop',(e)=>{e.preventDefault();const targetId=row.dataset.cid;const after=row.classList.contains('drag-over-bottom');row.classList.remove('drag-over-top','drag-over-bottom');if(qcDragSrcId&&targetId&&qcDragSrcId!==targetId){qcMoveColumn(qcDragSrcId,targetId,after);}qcDragSrcId=null;});
  });
}
function qcMoveColumn(fromId,toId,after){
  const fromIdx=qcColumns.findIndex(c=>c.id===fromId);
  let toIdx=qcColumns.findIndex(c=>c.id===toId);
  if(fromIdx===-1||toIdx===-1||fromIdx===toIdx)return;
  if(after)toIdx++;
  if(fromIdx<toIdx)toIdx--;
  const move=(arr)=>{const v=arr.splice(fromIdx,1)[0];arr.splice(toIdx,0,v);};
  move(qcColumns);
  qcUnits.forEach(u=>move(u.tests));
  qcSave();qcRender();
}
async function qcRenderArchivePanel(){
  const list=document.getElementById('qcArchiveList');
  list.innerHTML=`<div class="hint">불러오는 중…</div>`;

  if(archive.length===0){list.innerHTML=`<div class="hint">저장된 기록이 없어.</div>`;return;}
  list.innerHTML=archive.map(a=>{
    const totalUnits=a.units.length,totalCols=a.columns.length;
    const doneCells=a.units.reduce((acc,u)=>acc+a.columns.reduce((s,_,ci)=>{
      const own=u.tests[ci]||0;
      if(own===1)return s+1;
      const col=a.columns[ci];
      if(col&&col.category==='type'){
        const cap=(u.capacity||'').trim();
        if(cap&&a.units.some(o=>o.id!==u.id&&(o.capacity||'').trim()===cap&&(o.tests[ci]||0)===1))return s+1;
      }
      return s;
    },0),0);
    const totalCells=totalUnits*totalCols;
    const pct=totalCells>0?Math.round(doneCells/totalCells*100):0;
    const dateStr=new Date(a.savedAt).toLocaleString('ko-KR');
    return `<div class="arc-row">
      <div class="arc-info"><div class="arc-name">${esc(a.name)}</div><div class="arc-meta">${dateStr} · 호기 ${totalUnits}개 · 항목 ${totalCols}개 · 완료 ${pct}%</div></div>

    }
  };

function qcDownloadBlob(content,type,filename){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function qcToday(){

}

function supplyCompressImage(file,maxWidth,quality){
  maxWidth=maxWidth||480;quality=quality||0.7;
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxWidth/img.width);
        const canvas=document.createElement('canvas');
        canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;img.src=e.target.result;
    };
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}
function supplyHandlePhotoFile(file){
  if(!file)return;

  if(labelText)labelText.textContent='처리 중...';

    document.getElementById('sp-remove-photo').addEventListener('click',()=>{supplyState.photoData='';slot.innerHTML='';});
    supplyShowToast('사진이 첨부됐습니다');
  }).catch(()=>{
    if(labelText)labelText.textContent='파일 선택';
    supplyShowFormError('사진 처리에 실패했습니다. 다른 파일이나 캡처로 시도해 주세요.');
  });

function supplyPasteHandler(e){
  if(viewMode!=='supplies'||supplyState.view!=='requester')return;
  if(!document.getElementById('sp-add-form'))return;
  const cd=e.clipboardData||(e.originalEvent&&e.originalEvent.clipboardData);
  if(!cd||!cd.items)return;
  for(let i=0;i<cd.items.length;i++){
    if(cd.items[i].type.indexOf('image')!==-1){
      const file=cd.items[i].getAsFile();
      supplyHandlePhotoFile(file);
      e.preventDefault();
      break;
    }
  }
}

        html+=`<img class="req-thumb" src="${it.photo}" data-photo-view="${it.id}" style="cursor:zoom-in">`;
        html+='<div class="req-info">';
        html+=`<div class="req-name-row"><span class="req-name">${esc(it.name)}</span>${supplyPriorityBadge(it.priority)}<span class="qty-badge">x${esc(it.qty)}</span></div>`;
        if(it.link)html+=`<a class="req-link" href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">${esc(it.link)}</a>`;
        html+=`<div class="req-meta">신청자 · ${esc(it.requester)} · ${supplyWon(it.unitPrice)}${it.note?' · '+esc(it.note):''}</div>`;
        html+='</div>';
        if(canDel||isSupplyAdmin()){
          html+='<div class="req-actions">';
          if(isSupplyAdmin())html+=`<button class="move-next-btn" data-move="${it.id}" title="다음 달로 이동">▶다음달</button>`;
          if(canDel)html+=`<button class="trash-btn" data-del="${it.id}">🗑</button>`;
          html+='</div>';
        }
        html+='</div>';
      });
    }
    html+='</div>';
    box.innerHTML=html;
  }else{
    let html='<div class="list-toolbar"><span class="stat-text" id="sp-admin-stat-line">총 '+supplyState.items.length+'건 · 수량 합계 '+t.qty+'개 · 총 금액 '+supplyWon(t.amount)+'</span><div class="toolbar-actions"><button class="icon-btn" id="sp-refresh-btn">⟳</button><button class="copy-btn" id="sp-copy-btn" '+(supplyState.items.length===0?'disabled':'')+'>⧉ 표 복사</button></div></div><div class="panel">';
    if(items.length===0){
      html+='<div class="empty-state">등록된 품목이 없습니다. 신청자 화면에서 먼저 등록해 주세요.</div>';
    }else{
      html+='<div class="table-scroll"><table class="supply-table"><thead><tr><th style="width:36px">No</th><th class="left">상품명</th><th style="width:88px">우선순위</th><th style="width:110px">단가</th><th style="width:68px">수량</th><th style="width:100px">금액</th><th style="width:180px">비고<small>(알파몰 코드)</small></th><th style="width:104px">신청자</th><th style="width:76px"></th></tr></thead><tbody>';
      items.forEach((it,i)=>{
        const amount=(Number(it.unitPrice)||0)*(Number(it.qty)||0);
        html+=`<tr data-row="${it.id}"><td class="center mono">${i+1}</td><td><div class="prod-cell">`;
        html+=it.photo?`<img class="prod-thumb" src="${it.photo}" data-photo-view="${it.id}" style="cursor:zoom-in">`:'<div class="prod-thumb-empty"></div>';
        html+='<div style="min-width:0">';
        html+=`<div class="prod-name">${esc(it.name)}</div>`;
        if(it.link)html+=`<a class="prod-link" href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">${esc(it.link)}</a>`;
        html+='</div></div></td>';
        html+=`<td><select class="cell-input" data-id="${it.id}" data-field="priority"><option value="긴급" ${it.priority==='긴급'?'selected':''}>긴급</option><option value="보통" ${(!it.priority||it.priority==='보통')?'selected':''}>보통</option><option value="낮음" ${it.priority==='낮음'?'selected':''}>낮음</option></select></td>`;
        html+=`<td><input class="cell-input price" data-id="${it.id}" data-field="unitPrice" type="number" min="0" value="${esc(it.unitPrice)}"></td>`;
        html+=`<td><input class="cell-input" data-id="${it.id}" data-field="qty" type="number" min="1" value="${esc(it.qty)}"></td>`;
        html+=`<td class="right mono amount-cell">${supplyWon(amount)}</td>`;
        html+=`<td><input class="cell-input note-field" data-id="${it.id}" data-field="note" value="${esc(it.note)}" placeholder="알파몰코드"></td>`;
        html+=`<td class="center req-name-small">${esc(it.requester)}</td>`;
        html+=`<td class="center row-actions"><button class="move-next-btn icon-only" data-move="${it.id}" title="다음 달로 이동">▶</button><button class="trash-btn" data-del="${it.id}">🗑</button></td></tr>`;
      });
      html+=`</tbody><tfoot><tr><td colspan="5" class="center">총 금액</td><td class="right mono" id="sp-total-amount-cell">${supplyWon(t.amount)}</td><td colspan="3"></td></tr></tfoot></table></div>`;
    }
    html+='</div>';
    if(supplyState.items.length>0)html+='<div class="clear-row"><button class="clear-link" id="sp-clear-all-btn">이 달 목록 전체 삭제</button></div>';
    box.innerHTML=html;
  }
  supplyAttachListEvents();
}
function supplyAttachListEvents(){
  const box=document.getElementById('sp-list-container');
  box.querySelectorAll('[data-photo-view]').forEach(img=>{
    img.addEventListener('click',()=>{
      const item=supplyState.items.find(it=>it.id===img.dataset.photoView);
      if(item&&item.photo)openPhotoLightbox(item.photo);
    });
  });
  box.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const id=btn.dataset.del;
      await supplyDeleteItem(id);
      supplyState.items=supplyState.items.filter(it=>it.id!==id);
      supplyRenderList();
    });
  });
  box.querySelectorAll('[data-move]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const id=btn.dataset.move;
      const nextYm=supplyShiftYM(supplyState.ym,1);
      if(!confirm(`다음 달(${supplyYmLabel(nextYm)}) 목록으로 옮길까요?`))return;
      await supplyMoveItemToYm(id,nextYm);
      await supplyLoadState();
      supplyRenderList();
    });
  });
  const refreshBtn=document.getElementById('sp-refresh-btn');
  if(refreshBtn)refreshBtn.addEventListener('click',async()=>{await supplyLoadState();supplyRenderList();});
  const clearBtn=document.getElementById('sp-clear-all-btn');
  if(clearBtn)clearBtn.addEventListener('click',async()=>{
    if(!confirm(supplyYmLabel(supplyState.ym)+' 목록 '+supplyState.items.length+'건을 모두 삭제하시겠습니까? 삭제 후 복구할 수 없습니다.'))return;
    await supplyClearAllItems();
    supplyState.items=[];
    supplyRenderList();
  });
  const copyBtn=document.getElementById('sp-copy-btn');
  if(copyBtn)copyBtn.addEventListener('click',()=>{
    if(supplyState.items.length===0)return;
    const lines=[['No','상품명','단가','수량','금액','비고'].join('\t')];
    supplyState.items.forEach((it,i)=>{
      const amount=(Number(it.unitPrice)||0)*(Number(it.qty)||0);
      lines.push([i+1,it.name,Number(it.unitPrice)||0,Number(it.qty)||0,amount,it.note||''].join('\t'));
    });
    const t=supplyTotals();
    lines.push(['','총 금액','','',t.amount,''].join('\t'));
    const text=lines.join('\n');
    navigator.clipboard.writeText(text).then(()=>{supplyShowToast('기안 표를 복사했습니다 (엑셀에 바로 붙여넣기 가능)');}).catch(()=>{alert('복사 권한이 없습니다. 브라우저 설정을 확인해 주세요.');});
  });
  box.querySelectorAll('[data-field]').forEach(input=>{
    input.addEventListener('input',()=>{
      const id=input.dataset.id,field=input.dataset.field;
      const item=supplyState.items.find(it=>it.id===id);
      if(!item)return;
      item[field]=input.value;
      const row=input.closest('tr');
      const amount=(Number(item.unitPrice)||0)*(Number(item.qty)||0);
      const amtCell=row.querySelector('.amount-cell');
      if(amtCell)amtCell.textContent=supplyWon(amount);
      const tt=supplyTotals();
      const totalCell=document.getElementById('sp-total-amount-cell');
      if(totalCell)totalCell.textContent=supplyWon(tt.amount);
      const statLine=document.getElementById('sp-admin-stat-line');
      if(statLine)statLine.textContent='총 '+supplyState.items.length+'건 · 수량 합계 '+tt.qty+'개 · 총 금액 '+supplyWon(tt.amount);
    });
    input.addEventListener('change',()=>{supplyUpdateItemField(input.dataset.id,input.dataset.field,input.value);});
  });
}

(function(){loadTheme();applyTheme();initAuth();})();
</script>
