<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 업무 일정 관리 v6: 프로젝트 색상 직접 지정(프리셋 + 커스텀) · 테마(라이트/다크 + 강조색) · 파일/로컬 저장 · 데이터 분리 · 도움말/업데이트 이력 -->
<meta name="color-scheme" content="light dark">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    /* 공통 토큰 */
    --r:14px; --r-sm:10px;
    --font:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    /* 우선순위 색 (테마 공통) */
    --hi:#d2543a; --mid:#c08418; --lo:#5f8467;
    /* 강조색 기본값 (teal) — [data-accent]로 덮어씀 */
    --accent:#0e6b73; --accent-deep:#0a5057; --accent-rgb:14,107,115;
  }
  html{forced-color-adjust:none;}
  /* ── 라이트 모드 (기본) ── */
  :root,[data-theme="light"]{
    color-scheme:light only;
    --bg:#f6f7f9; --paper:#ffffff; --ink:#1d2127; --ink-soft:#646b75; --ink-faint:#9aa0a8;
    --line:#e8eaed; --line-soft:#f1f2f4;
    --accent-soft:rgba(var(--accent-rgb),.12); --accent-tint:rgba(var(--accent-rgb),.06);
    --hi-bg:rgba(210,84,58,.12); --mid-bg:rgba(192,132,24,.13); --lo-bg:rgba(95,132,103,.13);
    --done:#b3b8bf;
    --st-todo:#9aa0a8; --st-doing:var(--accent); --st-review:#c08418; --st-done:#5f8467;
    --shadow-sm:0 1px 2px rgba(20,24,30,.04);
    --shadow:0 1px 3px rgba(20,24,30,.05),0 4px 16px rgba(20,24,30,.05);
    --shadow-lg:0 20px 50px rgba(20,24,30,.18);
    --cell-bg:#fbfbfc;
  }
  /* ── 다크 모드 ── */
  [data-theme="dark"]{
    color-scheme:dark only;
    --bg:#16181c; --paper:#202329; --ink:#e8eaed; --ink-soft:#9aa1ac; --ink-faint:#6b7280;
    --line:#30343b; --line-soft:#272b31;
    --accent-soft:rgba(var(--accent-rgb),.22); --accent-tint:rgba(var(--accent-rgb),.12);
    --hi-bg:rgba(210,84,58,.2); --mid-bg:rgba(192,132,24,.2); --lo-bg:rgba(95,132,103,.2);
    --done:#5b616b;
    --st-todo:#6b7280; --st-doing:var(--accent); --st-review:#c08418; --st-done:#5f8467;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 20px 50px rgba(0,0,0,.55);
    --cell-bg:#1b1e23;
  }
  /* ── 강조색 팔레트 ── */
  [data-accent="teal"]{   --accent:#0e6b73; --accent-deep:#0a5057; --accent-rgb:14,107,115; }
  [data-accent="violet"]{ --accent:#6d4ed6; --accent-deep:#5739bf; --accent-rgb:109,78,214; }
  [data-accent="red"]{    --accent:#e0483f; --accent-deep:#c2362e; --accent-rgb:224,72,63; }
  [data-accent="green"]{  --accent:#5a9e2f; --accent-deep:#487f25; --accent-rgb:90,158,47; }
  [data-accent="slate"]{  --accent:#3f4a5c; --accent-deep:#2d3543; --accent-rgb:63,74,92; }
  [data-accent="blue"]{   --accent:#1d8fe0; --accent-deep:#1574bb; --accent-rgb:29,143,224; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{margin:0;padding:0;background:var(--bg);}
  #app{font-family:var(--font);color:var(--ink);background:var(--bg);min-height:100vh;
    padding:26px clamp(16px,4vw,40px) 40px;-webkit-font-smoothing:antialiased;}
  .mono{font-family:var(--mono);font-feature-settings:"tnum";}

  /* ── topbar ── */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 22px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--accent),var(--accent-deep));
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(14,107,115,.28);flex-shrink:0;}
  .brand .mark svg{width:20px;height:20px;}
  .brand h1{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
  .brand .sub{font-size:12px;color:var(--ink-faint);margin-top:2px;letter-spacing:.01em;}
  .top-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .clock{font-size:12.5px;color:var(--ink-soft);letter-spacing:.02em;}
  .report-btn{font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:7px 13px;border-radius:9px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(var(--accent-rgb),.28);white-space:nowrap;}
  .report-btn:hover{background:var(--accent-deep);border-color:var(--accent-deep);box-shadow:0 3px 11px rgba(var(--accent-rgb),.36);}
  .report-btn:active{transform:translateY(1px);}
  .report-btn svg{width:14px;height:14px;}
  .seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:3px;box-shadow:var(--shadow-sm);}
  .seg button{font-family:inherit;font-size:13px;font-weight:600;border:none;background:transparent;color:var(--ink-soft);
    padding:7px 16px;border-radius:8px;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:6px;}
  .seg button svg{width:15px;height:15px;}
  .seg button.on{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(14,107,115,.25);}
  .seg button:not(.on):hover{color:var(--ink);}

  /* ── controls row ── */
  .controls{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 18px;}
  .proj-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .proj-bar .lbl{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-faint);margin-right:2px;text-transform:uppercase;}
  .proj-bar .projchip.on{background:var(--accent-tint);border-color:var(--accent);color:var(--accent-deep);}
  .proj-bar .projchip.on:hover{color:var(--accent-deep);}
  .proj-bar .projall.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .proj-bar .projall.on:hover{color:#fff;}
  .proj-bar .pcheck{font-size:11px;font-weight:800;color:var(--accent);display:inline-flex;margin-right:-1px;}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);padding:6px 13px;border-radius:20px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow-sm);}
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip.on:hover{color:#fff;}
  .chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .chip .edit{font-size:12px;opacity:0;margin-left:1px;width:0;transition:all .15s;overflow:hidden;}
  .chip:hover .edit{opacity:.55;width:13px;}
  .chip.add{border-style:dashed;color:var(--ink-soft);background:transparent;box-shadow:none;}
  .chip.projchip.archived{opacity:.55;border-style:dashed;}
  .chip.toggle-archived{border-style:dashed;color:var(--ink-soft);background:transparent;box-shadow:none;font-size:12px;}
  .chip.add:hover{color:var(--accent);}
  .io-btns{display:flex;gap:7px;}
  /* ── 역할별 화면 제어 (팀원: 캘린더 조작·칸반·집계 숨김) ── */
  body[data-role="member"] #vt-kan,
  body[data-role="member"] #imp-wrap,body[data-role="member"] .btn-primary,
  body[data-role="member"] .proj-bar .chip.add,body[data-role="member"] .proj-bar .edit{display:none !important;}
  body[data-role="supplies"] #vt-cal,body[data-role="supplies"] #vt-kan,body[data-role="supplies"] #vt-note,
  body[data-role="supplies"] #vt-qc,body[data-role="supplies"] #leave-bell-btn,body[data-role="supplies"] #signup-bell-btn,
  body[data-role="supplies"] #leave-request-btn,body[data-role="supplies"] .controls{display:none !important;}
  body[data-role="leader"] #leave-request-btn{display:none !important;}
  body[data-role="member"] .ti .box{pointer-events:none;opacity:.5;}
  .leave-badge{background:#e0483f;color:#fff;font-size:10px;font-weight:800;border-radius:8px;min-width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;margin-left:4px;padding:0 4px;}
  .photo-lightbox{position:fixed;inset:0;background:rgba(20,22,26,.86);display:none;align-items:center;justify-content:center;z-index:99999;cursor:zoom-out;padding:28px;}
  .photo-lightbox.show{display:flex;}
  .photo-lightbox img{max-width:92vw;max-height:92vh;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.5);cursor:default;}
  #leave-bell-btn .leave-badge{position:absolute;top:-4px;right:-4px;margin-left:0;box-shadow:0 0 0 2px var(--paper);}
  body[data-role="leader"] #leave-bell-btn{display:inline-flex !important;}
  body[data-role="leader"] #signup-bell-btn{display:inline-flex !important;}
  .lr-pending{background:var(--accent-tint);border:1px solid var(--accent);}
  .lr-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);}
  .lr-row:first-of-type{border-top:none;}
  .lr-head{font-weight:700;margin-bottom:4px;}
  .lr-info{font-size:13px;}
  .lr-memo{color:var(--ink-soft);font-size:12px;margin-top:2px;}
  .lr-actions{display:flex;gap:6px;flex-shrink:0;}
  .lr-actions button{font-size:12px;padding:6px 10px;}
  .ro-field{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--cell-bg);color:var(--ink-soft);font-size:13.5px;}
  .io-btns button{font-family:inherit;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:var(--paper);
    color:var(--ink-soft);padding:7px 13px;border-radius:9px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;box-shadow:var(--shadow-sm);}
  .io-btns button:hover{border-color:var(--accent);color:var(--accent);}
  .io-btns button svg{width:14px;height:14px;}

  /* ── layout ── */
  .layout{display:grid;grid-template-columns:1fr 348px;gap:18px;align-items:start;}
  .layout.kanban-mode{grid-template-columns:1fr;}
  @media(max-width:900px){.layout{grid-template-columns:1fr;}}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;}

  /* ── calendar header ── */
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line-soft);gap:12px;flex-wrap:wrap;}
  .cal-left{display:flex;align-items:center;gap:14px;}
  .cal-title{display:flex;align-items:baseline;gap:9px;}
  .cal-title .mo{font-size:23px;font-weight:700;letter-spacing:-.02em;}
  .cal-title .yr{font-family:var(--mono);font-size:13px;color:var(--ink-faint);letter-spacing:.04em;}
  .nav{display:flex;gap:5px;align-items:center;}
  .nav button{font-family:var(--mono);border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);
    width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:16px;transition:all .15s;display:flex;align-items:center;justify-content:center;}
  .nav button:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .nav .today{width:auto;padding:0 14px;font-family:var(--font);font-size:13px;font-weight:600;height:34px;}
  .btn-primary{font-family:inherit;font-size:13.5px;font-weight:600;border:none;background:var(--accent);color:#fff;
    padding:9px 17px;border-radius:10px;cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;gap:7px;
    box-shadow:0 3px 10px rgba(14,107,115,.28);}
  .btn-primary:hover{background:var(--accent-deep);transform:translateY(-1px);box-shadow:0 5px 14px rgba(14,107,115,.32);}
  .btn-primary:active{transform:none;}
  .btn-primary svg{width:16px;height:16px;}

  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);padding:12px 14px 6px;gap:7px;}
  .weekdays div{text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.03em;}
  .weekdays div:first-child{color:var(--hi);} .weekdays div:last-child{color:var(--accent);}
  .cal-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:7px;}
  .week{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
  .cell{position:relative;border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:7px 8px;cursor:pointer;
    background:var(--cell-bg);transition:all .15s;overflow:hidden;}
  .cell:hover{border-color:var(--accent);background:var(--paper);box-shadow:0 2px 8px rgba(14,107,115,.1);}
  .cell:hover::after{content:"+";position:absolute;top:5px;right:8px;font-size:15px;font-weight:600;color:var(--accent);opacity:.55;}
  .cell.muted{opacity:.45;} .cell.muted:hover::after{display:none;}
  .cell.today{border-color:var(--accent);background:var(--accent-tint);box-shadow:inset 0 0 0 2px var(--accent);}
  .today-badge{display:inline-block;vertical-align:middle;margin-left:4px;background:var(--accent);color:#fff;font-size:9px;font-weight:800;letter-spacing:.01em;padding:1.5px 6px;border-radius:20px;line-height:1.5;white-space:nowrap;animation:todayBlink 1.9s ease-in-out infinite;}
  @keyframes todayBlink{0%,100%{opacity:1;}50%{opacity:.6;}}
  .cell .dnum{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .cell.today .dnum{background:var(--accent);color:#fff;border-radius:6px;padding:2px 5px;font-weight:600;}
  .cell .dnum.sun{color:var(--hi);} .cell .dnum.sat{color:var(--accent);}
  .cell .dnum.hol{color:var(--hi);}
  .cell.holiday{background:var(--hi-bg);border-color:rgba(210,84,58,.25);}
  .cell.today.holiday{background:var(--accent-tint);}
  .hol-lbl{position:absolute;top:6px;right:7px;font-size:9.5px;font-weight:700;color:var(--hi);background:var(--hi-bg);padding:1.5px 6px;border-radius:6px;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.45;pointer-events:none;}
  /* ── 단가 입력 (모달) ── */
  .m-price{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .m-price .field-lbl{margin:0;}
  .m-price-in{width:140px;font-family:var(--mono);text-align:right;}
  .m-price-won{font-size:13px;color:var(--ink-soft);}
  .m-price-hint{font-size:11.5px;color:var(--ink-faint);}
  /* ── 집계 ── */
  .stats-wrap{padding:20px clamp(14px,3vw,26px) 28px;}
  .stats-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .stats-filter{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;}
  .stats-filter .chip{cursor:pointer;font-family:inherit;}
  .stats-filter .statchip.on{background:var(--accent-tint);border-color:var(--accent);color:var(--accent-deep);}
  .stats-filter .statchip.on:hover{color:var(--accent-deep);}
  .stats-filter .statall.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .stats-filter .statall.on:hover{color:#fff;}
  .stats-check{font-size:11px;font-weight:800;color:var(--accent);min-width:9px;display:inline-flex;justify-content:center;}
  .stats-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px;}
  .stats-sumcard{border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:16px 18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:5px;}
  .stats-sumcard span{font-size:12.5px;color:var(--ink-soft);font-weight:500;}
  .stats-sumcard b{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--ink);}
  .stats-sumcard b i{font-size:14px;font-style:normal;font-weight:600;color:var(--ink-faint);margin-left:3px;}
  .stats-sumcard.muted b{color:var(--ink-faint);font-size:18px;}
  .stats-card{border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:15px 17px;box-shadow:var(--shadow-sm);margin-bottom:16px;}
  .stats-h{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em;margin-bottom:13px;}
  .stats-h span{font-weight:500;color:var(--ink-faint);}
  .stats-list{display:flex;flex-direction:column;gap:11px;}
  .stats-row{display:flex;align-items:center;gap:10px;}
  .stats-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .stats-name{font-size:13px;font-weight:600;color:var(--ink);width:120px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stats-bar{flex:1;height:8px;background:var(--cell-bg);border-radius:5px;overflow:hidden;min-width:40px;}
  .stats-barfill{height:100%;border-radius:5px;transition:width .4s cubic-bezier(.2,.8,.2,1);}
  .stats-cnt{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);width:48px;text-align:right;flex-shrink:0;}
  .stats-amt{font-family:var(--mono);font-size:12px;color:var(--accent-deep);font-weight:600;width:118px;text-align:right;flex-shrink:0;}
  .stats-amt.empty{color:var(--ink-faint);font-weight:500;}
  .stats-empty{font-size:13px;color:var(--ink-faint);text-align:center;padding:24px 0;}
  .stats-months{display:flex;gap:5px;align-items:flex-end;}
  .stats-mon{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;cursor:pointer;padding:6px 2px;border-radius:8px;transition:background .15s;}
  .stats-mon:hover{background:var(--cell-bg);}
  .stats-mon.on{background:var(--accent-tint);}
  .stats-monwrap{height:70px;display:flex;align-items:flex-end;width:100%;justify-content:center;}
  .stats-monbar{width:60%;max-width:24px;min-height:0;background:var(--line);border-radius:4px 4px 0 0;transition:height .4s cubic-bezier(.2,.8,.2,1);}
  .stats-mon.on .stats-monbar{background:var(--accent);}
  .stats-mon:hover .stats-monbar{background:var(--accent-soft);}
  .stats-mon.on:hover .stats-monbar{background:var(--accent);}
  .stats-monn{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-soft);}
  .stats-monl{font-size:10px;color:var(--ink-faint);}
  .stats-mon.on .stats-monl{color:var(--accent);font-weight:600;}
  .notes-wrap{padding:20px clamp(14px,3vw,26px) 24px;display:flex;flex-direction:column;min-height:calc(100vh - 240px);}
  .notes-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .memo-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .autonum-btn{font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);padding:6px 12px;border-radius:9px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
  .autonum-btn:hover{border-color:var(--accent);color:var(--accent);}
  .autonum-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .autonum-ico{font-family:var(--mono);font-weight:800;}
  .memo-saved{font-size:11.5px;color:var(--ink-faint);font-weight:600;transition:color .2s;}
  .memo-saved.saving{color:var(--accent);}
  .memo-pad{flex:1;width:100%;min-height:60vh;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--shadow-sm);font-family:inherit;font-size:14px;line-height:1.75;color:var(--ink);padding:20px 22px;outline:none;resize:none;transition:border-color .15s;}
  .memo-pad:focus{border-color:var(--accent);}
  .memo-pad::placeholder{color:var(--ink-faint);}
  .memo-modeseg{display:inline-flex;background:var(--cell-bg);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;}

  .memo-datebar{display:flex;align-items:center;gap:11px;margin-bottom:12px;flex-wrap:wrap;}

  .wk-range{font-size:13.5px;font-weight:700;color:var(--accent-deep);letter-spacing:.01em;}
  .wk-copy{margin-left:auto;font-family:inherit;font-size:12px;font-weight:600;border:1px solid var(--accent);background:var(--paper);color:var(--accent);padding:5px 11px;border-radius:8px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
  .wk-copy:hover{background:var(--accent);color:#fff;}
  .wk-copy svg{width:13px;height:13px;}
  .dmemo-card{break-inside:avoid;display:inline-block;width:100%;margin-bottom:14px;border:1px solid var(--line);border-radius:13px;background:var(--paper);box-shadow:var(--shadow-sm);padding:13px 15px 15px;}
  .dmemo-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;}

  .dmemo-del:hover{color:var(--danger,#e0483f);background:var(--cell-bg);}
  .dmemo-del svg{width:15px;height:15px;}
  .dmemo-ta{width:100%;min-height:90px;border:none;background:none;font-family:inherit;font-size:13.5px;line-height:1.7;color:var(--ink);outline:none;resize:none;overflow:hidden;padding:0;}

  .dmemo-empty{font-size:13px;color:var(--ink-faint);padding:30px 4px;text-align:center;}

  .cell .more{font-size:10.5px;font-weight:600;color:var(--ink-faint);position:absolute;bottom:5px;left:9px;}
  .bars{position:absolute;inset:0;pointer-events:none;}

    padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;pointer-events:auto;
    box-shadow:0 1px 3px rgba(0,0,0,.16);transition:filter .12s,transform .12s;}

  .ebar .bc{font-family:var(--mono);font-size:9.5px;opacity:.88;margin-right:5px;}

  /* ── todo panel ── */
  .tp-head{padding:18px 18px 14px;border-bottom:1px solid var(--line-soft);}
  .tp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;}
  .tp-head h2{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:9px;letter-spacing:-.01em;}
  .tp-head h2 .cnt{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:11px;}
  .seg-sm{display:inline-flex;background:var(--bg);border-radius:9px;padding:3px;}
  .seg-sm button{font-family:inherit;font-size:11px;font-weight:600;border:none;background:transparent;color:var(--ink-soft);padding:5px 10px;border-radius:6px;cursor:pointer;transition:all .15s;}
  .seg-sm button.on{background:var(--paper);color:var(--accent);box-shadow:var(--shadow-sm);}
  .filters{display:flex;gap:6px;flex-wrap:wrap;}
  .filters button{font-family:inherit;font-size:11.5px;font-weight:500;border:1px solid var(--line);background:transparent;color:var(--ink-soft);
    padding:5px 11px;border-radius:18px;cursor:pointer;transition:all .15s;}
  .filters button:hover{border-color:var(--accent);color:var(--accent);}
  .filters button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tp-list{padding:10px 13px 16px;max-height:600px;overflow-y:auto;}

  .ti{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:var(--r-sm);border:1px solid var(--line-soft);
    background:var(--cell-bg);margin-bottom:7px;transition:all .15s;}
  .ti:hover{border-color:var(--line);background:var(--paper);box-shadow:var(--shadow-sm);}
  .ti.done{opacity:.52;}
  .ti .box{flex-shrink:0;width:19px;height:19px;margin-top:1px;border:2px solid var(--line);border-radius:6px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:12px;color:#fff;background:var(--cell-bg);}
  .ti .box:hover{border-color:var(--accent);}
  .ti.done .box{background:var(--accent);border-color:var(--accent);}
  .ti .body{flex:1;min-width:0;}
  .ti .txt{font-size:13.5px;line-height:1.4;font-weight:500;}
  .ti.done .txt{text-decoration:line-through;color:var(--done);}
  .ti .meta{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;}
  .pill{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:5px;letter-spacing:.03em;}
  .pill.hi{color:var(--hi);background:var(--hi-bg);} .pill.mid{color:var(--mid);background:var(--mid-bg);} .pill.lo{color:var(--lo);background:var(--lo-bg);}
  .stp{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:5px;letter-spacing:.02em;color:#fff;}
  .dday{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:5px;letter-spacing:.01em;}
  .dday.over{color:#fff;background:var(--hi);} .dday.urgent{color:var(--hi);background:var(--hi-bg);}
  .dday.soon{color:var(--mid);background:var(--mid-bg);} .dday.norm{color:var(--ink-soft);background:var(--bg);}
  .dday.run{color:var(--accent);background:var(--accent-soft);}

  .src .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;} .src:hover{color:var(--accent);}

  /* ── kanban ── */
  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:16px;}
  @media(max-width:900px){.kanban{grid-template-columns:repeat(4,minmax(230px,1fr));overflow-x:auto;}}
  .kcol{background:var(--cell-bg);border:1px solid var(--line-soft);border-radius:var(--r);display:flex;flex-direction:column;min-height:200px;transition:all .15s;}

  .kcol-head .name{font-size:13.5px;font-weight:700;}

  .kcard{background:var(--paper);border:1px solid var(--line);border-left:3px solid;border-radius:var(--r-sm);padding:11px 12px;cursor:grab;transition:all .15s;box-shadow:var(--shadow-sm);}
  .kcard:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .kcard:active{cursor:grabbing;} .kcard.dragging{opacity:.4;}
  .kcard .ktxt{font-size:13px;line-height:1.4;margin-bottom:8px;font-weight:500;}

  .kcard .ksrc .dot{width:7px;height:7px;border-radius:50%;}
  .kempty{text-align:center;color:var(--ink-faint);font-size:11.5px;padding:22px 8px;opacity:.6;}

  /* ── modal ── */
  .scrim{position:fixed;inset:0;background:rgba(24,28,32,.46);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:44px 18px;z-index:50;overflow-y:auto;}
  .scrim.show{display:flex;}
  .modal{background:var(--paper);border-radius:18px;width:100%;max-width:540px;box-shadow:var(--shadow-lg);border:1px solid var(--line);animation:pop .22s cubic-bezier(.2,.8,.2,1);}
  @keyframes pop{from{transform:translateY(16px) scale(.97);opacity:0;}to{transform:none;opacity:1;}}
  .m-head{padding:22px 24px 16px;border-bottom:1px solid var(--line-soft);}
  .m-date{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.03em;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
  .m-date svg{width:13px;height:13px;}
  .m-title-in{width:100%;border:none;background:transparent;font-family:inherit;font-size:21px;font-weight:700;color:var(--ink);outline:none;border-bottom:2px solid transparent;padding:3px 0;transition:border-color .15s;letter-spacing:-.01em;}
  .m-title-in:focus{border-color:var(--accent-soft);} .m-title-in::placeholder{color:var(--ink-faint);opacity:.6;font-weight:600;}
  .m-body{padding:18px 24px 4px;}
  .field-lbl{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:13px;margin-bottom:18px;}
  @media(max-width:540px){.row3{grid-template-columns:1fr;}}
  .m-in,.m-sel{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--cell-bg);font-family:inherit;font-size:13.5px;color:var(--ink);padding:10px 12px;outline:none;transition:border-color .15s;}
  .m-sel{cursor:pointer;} .m-in:focus,.m-sel:focus{border-color:var(--accent);background:var(--paper);}
  .tmpl-bar{display:flex;gap:9px;align-items:center;margin-bottom:18px;padding:13px 14px;background:var(--accent-tint);border:1px solid var(--accent-soft);border-radius:11px;}
  .tmpl-bar .field-lbl{margin:0;color:var(--accent-deep);white-space:nowrap;}
  .tmpl-bar select{flex:1;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-family:inherit;font-size:13px;padding:8px 10px;outline:none;cursor:pointer;}
  .tmpl-bar .ap{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 15px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;}
  .tmpl-bar .ap:hover{background:var(--accent-deep);}
  .m-memo{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--cell-bg);font-family:inherit;font-size:13.5px;color:var(--ink);padding:11px 12px;resize:vertical;min-height:56px;outline:none;line-height:1.55;margin-bottom:18px;transition:border-color .15s;}
  .m-memo:focus{border-color:var(--accent);background:var(--paper);}
  .todo-add{display:flex;gap:8px;margin-bottom:12px;}
  .todo-add input{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--cell-bg);font-family:inherit;font-size:13.5px;padding:10px 12px;outline:none;color:var(--ink);transition:border-color .15s;}
  .todo-add input:focus{border-color:var(--accent);background:var(--paper);}
  .todo-add select{border:1px solid var(--line);border-radius:10px;background:var(--cell-bg);font-family:var(--mono);font-size:12px;padding:0 9px;outline:none;cursor:pointer;color:var(--ink);}
  .todo-add button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:0 17px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:background .15s;}
  .todo-add button:hover{background:var(--accent-deep);}
  .m-todos{margin-bottom:8px;}
  .mt{display:flex;gap:9px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line-soft);}
  .mt:last-child{border-bottom:none;}
  .mt .txt{flex:1;font-size:13.5px;font-weight:500;} .mt.done .txt{text-decoration:line-through;color:var(--done);}
  .mt select{border:1px solid var(--line);border-radius:7px;background:var(--cell-bg);font-family:var(--mono);font-size:10px;font-weight:600;padding:4px 5px;outline:none;cursor:pointer;}
  .mt .del{border:none;background:none;cursor:pointer;color:var(--ink-faint);font-size:18px;line-height:1;padding:0 5px;transition:color .15s;} .mt .del:hover{color:var(--hi);}
  .m-empty{font-size:12.5px;color:var(--ink-faint);padding:8px 4px;}
  .m-foot{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 20px;border-top:1px solid var(--line-soft);margin-top:10px;gap:9px;flex-wrap:wrap;}
  .m-foot .left{display:flex;gap:9px;}
  .m-foot .danger{border:1px solid var(--line);color:var(--hi);background:transparent;font-family:inherit;font-size:12.5px;font-weight:500;padding:8px 14px;border-radius:9px;cursor:pointer;transition:all .15s;}
  .m-foot .danger:hover{background:var(--hi);color:#fff;border-color:var(--hi);}
  .m-foot .ghost{border:1px solid var(--line);color:var(--ink-soft);background:transparent;font-family:inherit;font-size:12.5px;font-weight:500;padding:8px 14px;border-radius:9px;cursor:pointer;transition:all .15s;}
  .m-foot .ghost:hover{border-color:var(--accent);color:var(--accent);}
  .m-foot .done-btn{background:var(--ink);color:#fff;border:none;font-family:inherit;font-size:14px;font-weight:600;padding:10px 24px;border-radius:10px;cursor:pointer;transition:all .15s;}
  .m-foot .done-btn:hover{background:var(--accent-deep);}
  .saving{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-family:var(--font);font-size:12.5px;font-weight:500;background:var(--ink);color:#fff;padding:9px 18px;border-radius:22px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:80;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow-lg);}
  .saving.show{opacity:.96;} .saving svg{width:14px;height:14px;}
  .loading{text-align:center;padding:90px 20px;color:var(--ink-faint);font-family:var(--mono);font-size:13px;}
  /* ── 설정 버튼 & 패널 ── */
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);
    color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;box-shadow:var(--shadow-sm);}
  .icon-btn:hover{color:var(--accent);border-color:var(--accent);}
  .icon-btn svg{width:18px;height:18px;}
  .settings-pop{position:fixed;top:0;right:0;width:300px;max-width:88vw;height:100%;background:var(--paper);
    border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:70;transform:translateX(100%);
    transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;}
  .settings-pop.show{transform:none;}
  .sp-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 16px;border-bottom:1px solid var(--line-soft);}
  .sp-head h3{font-size:16px;font-weight:700;letter-spacing:-.01em;}
  .sp-close{border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:22px;line-height:1;padding:0 4px;transition:color .15s;}
  .sp-close:hover{color:var(--ink);}
  .sp-body{padding:20px 22px;overflow-y:auto;}
  .sp-sec{margin-bottom:26px;}
  .sp-sec .sp-lbl{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em;margin-bottom:13px;display:flex;align-items:center;gap:7px;}
  .sp-sec .sp-lbl svg{width:15px;height:15px;}
  .mode-opts{display:flex;flex-direction:column;gap:9px;}
  .mode-opt{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:all .15s;font-size:13.5px;font-weight:500;}
  .mode-opt:hover{border-color:var(--accent);}
  .mode-opt.on{border-color:var(--accent);background:var(--accent-tint);}
  .mode-opt .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .mode-opt.on .radio{border-color:var(--accent);}
  .mode-opt.on .radio::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .mode-opt .mo-ic{width:17px;height:17px;color:var(--ink-soft);}
  .mode-opt.on .mo-ic{color:var(--accent);}
  .accent-grid{display:flex;gap:11px;flex-wrap:wrap;}
  .acc-sw{width:42px;height:42px;border-radius:11px;cursor:pointer;border:2px solid transparent;position:relative;transition:transform .12s;display:flex;align-items:center;justify-content:center;}
  .acc-sw:hover{transform:scale(1.08);}
  .acc-sw.on{border-color:var(--ink);}
  .acc-sw.on::after{content:"✓";color:#fff;font-size:18px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.3);}
  .sp-note{font-size:11.5px;color:var(--ink-faint);line-height:1.6;padding-top:6px;border-top:1px solid var(--line-soft);margin-top:4px;}
  /* ── 도움말 패널 ── */
  #help-modal{max-width:560px;}
  .help-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--line);}
  .help-head h2{font-size:17px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;}
  .help-head h2 svg{width:19px;height:19px;color:var(--accent);}
  .help-body{padding:18px 24px 24px;max-height:64vh;overflow-y:auto;}
  .help-sec{margin-bottom:22px;}
  .help-sec:last-child{margin-bottom:0;}
  .help-sec h3{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em;text-transform:uppercase;margin-bottom:11px;display:flex;align-items:center;gap:7px;}
  .help-sec h3 svg{width:15px;height:15px;color:var(--accent);}
  .guide-list{display:flex;flex-direction:column;gap:9px;}
  .guide-item{display:flex;gap:10px;font-size:13.5px;line-height:1.55;color:var(--ink);}

  .log-list{display:flex;flex-direction:column;gap:14px;}
  .log-item{position:relative;padding-left:20px;}
  .log-item::before{content:"";position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .log-item::after{content:"";position:absolute;left:7.5px;top:16px;bottom:-14px;width:1px;background:var(--line);}
  .log-item:last-child::after{display:none;}
  .log-top{display:flex;align-items:baseline;gap:9px;margin-bottom:5px;flex-wrap:wrap;}
  .log-ver{font-weight:700;font-size:13.5px;}
  .log-cur{font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:20px;}
  .log-date{font-size:11.5px;color:var(--ink-faint);font-family:var(--mono);}
  .log-item ul{list-style:none;display:flex;flex-direction:column;gap:3px;}
  .log-item li{font-size:12.5px;color:var(--ink-soft);line-height:1.5;padding-left:11px;position:relative;}
  .log-item li::before{content:"·";position:absolute;left:1px;color:var(--ink-faint);}
  .help-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;}
  /* ── 프로젝트 편집 모달 ── */
  #proj-modal{max-width:430px;}
  #proj-modal .m-head{display:flex;flex-direction:column;}
  .pj-preview-dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--line);}
  .pj-swatches{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px;}
  .pj-sw{width:34px;height:34px;border-radius:9px;border:2px solid transparent;cursor:pointer;position:relative;transition:transform .12s;padding:0;outline:none;}
  .pj-sw:hover{transform:scale(1.1);}
  .pj-sw.on{border-color:var(--ink);}
  .pj-sw.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.35);}
  .pj-custom{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
  .pj-custom-lbl{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 13px 6px 7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-soft);transition:all .15s;}
  .pj-custom-lbl:hover{border-color:var(--accent);color:var(--accent);}
  .pj-custom-lbl.on{border-color:var(--accent);color:var(--accent);background:var(--accent-tint);}
  .pj-custom-lbl input[type=color]{width:26px;height:26px;border:none;background:none;padding:0;cursor:pointer;border-radius:7px;}
  .pj-custom-lbl input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
  .pj-custom-lbl input[type=color]::-webkit-color-swatch{border:1px solid var(--line);border-radius:7px;}
  .pj-custom-lbl input[type=color]::-moz-color-swatch{border:1px solid var(--line);border-radius:7px;}
  .pj-hex{font-size:12px;color:var(--ink-faint);letter-spacing:.05em;}
  .pj-note{font-size:11.5px;color:var(--accent-deep);line-height:1.55;background:var(--accent-tint);border:1px solid var(--accent-soft);border-radius:9px;padding:9px 12px;margin-top:14px;}
  #proj-modal .m-foot{margin-top:6px;}
  /* ── 휴가 태깅(모달) ── */
  .leave-box{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:18px;background:var(--cell-bg);transition:all .15s;}
  .leave-box.on{border-color:var(--accent-soft);background:var(--accent-tint);}
  .lv-chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .lv-chk input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
  .leave-box.on .lv-chk{color:var(--accent-deep);}
  .lv-auto{display:block;margin-top:7px;font-size:11.5px;color:var(--ink-faint);line-height:1.4;}
  .lv-row-in{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap;}
  .lv-kindsel{border:1px solid var(--line);border-radius:9px;background:var(--paper);font-family:inherit;font-size:13px;padding:8px 10px;outline:none;cursor:pointer;color:var(--ink);}
  .lv-amt{width:74px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-family:var(--mono);font-size:13px;padding:8px 10px;outline:none;color:var(--ink);}
  .lv-amt:focus,.lv-kindsel:focus{border-color:var(--accent);}
  .lv-unit{font-size:12.5px;color:var(--ink-soft);}
  .lv-eq{font-size:11.5px;color:var(--accent-deep);font-weight:600;background:var(--accent-soft);padding:3px 9px;border-radius:20px;}
  /* ── 휴가 대시보드 ── */
  .leave-wrap{padding:22px clamp(14px,3vw,26px) 28px;}
  .lv-setup-empty{text-align:center;padding:64px 24px;color:var(--ink-soft);}
  .lv-setup-empty .lv-ic{width:54px;height:54px;margin:0 auto 18px;color:var(--accent);opacity:.85;}
  .lv-setup-empty .lv-ic svg{width:100%;height:100%;}
  .lv-setup-empty h3{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:10px;letter-spacing:-.01em;}
  .lv-setup-empty p{font-size:13px;line-height:1.65;color:var(--ink-faint);margin-bottom:20px;}
  .lv-hire-in{max-width:220px;margin:0 auto;text-align:center;}
  .lv-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .lv-hire{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .lv-hire .field-lbl{margin:0;}
  .lv-hire .m-in{width:auto;max-width:170px;}
  .lv-svc{font-size:12.5px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);padding:5px 11px;border-radius:20px;}
  .lv-roundsel{border:1px solid var(--line);border-radius:9px;background:var(--paper);font-family:inherit;font-size:12px;font-weight:500;padding:6px 9px;outline:none;cursor:pointer;color:var(--ink-soft);}
  .lv-roundsel:focus,.lv-roundsel:hover{border-color:var(--accent);color:var(--accent);}
  .lv-yearnav{display:flex;align-items:center;gap:6px;}
  .lv-yearnav button{width:32px;height:32px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);border-radius:9px;cursor:pointer;font-size:17px;line-height:1;transition:all .15s;display:flex;align-items:center;justify-content:center;}
  .lv-yearnav button:hover{border-color:var(--accent);color:var(--accent);}
  .lv-yearnav .lv-yr{font-size:18px;font-weight:700;letter-spacing:-.01em;min-width:62px;text-align:center;}
  .lv-yearnav .lv-yr i{font-size:12px;font-style:normal;color:var(--ink-faint);font-weight:600;margin-left:2px;}
  .lv-yearnav .lv-today{width:auto;padding:0 12px;font-family:var(--font);font-size:12.5px;font-weight:600;}
  .lv-summary{display:flex;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border-radius:14px;padding:18px 22px;margin-bottom:18px;box-shadow:0 6px 18px rgba(var(--accent-rgb),.28);}
  .lv-sum-main{display:flex;flex-direction:column;gap:3px;}
  .lv-sum-main span{font-size:12.5px;opacity:.92;font-weight:500;}
  .lv-sum-main b{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;}
  .lv-sum-main b i{font-size:15px;font-style:normal;font-weight:600;margin-left:3px;opacity:.9;}
  .lv-sum-main b.neg{color:#ffd9d2;}
  .lv-sum-sub{font-size:12px;opacity:.85;font-family:var(--mono);text-align:right;}
  .lv-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:14px;margin-bottom:18px;}
  .lv-card{border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:15px 17px;box-shadow:var(--shadow-sm);}
  .lv-card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;}
  .lv-tag{font-size:11.5px;font-weight:700;letter-spacing:.01em;padding:4px 10px;border-radius:20px;}
  .lv-tag.fiscal{color:var(--accent-deep);background:var(--accent-soft);}
  .lv-tag.monthly{color:var(--mid);background:var(--mid-bg);}
  .lv-ov{font-size:10px;font-weight:700;color:var(--ink-faint);border:1px solid var(--line);padding:2px 7px;border-radius:20px;}
  .lv-card-b{display:flex;align-items:center;gap:16px;}
  .lv-ring{position:relative;width:80px;height:80px;flex-shrink:0;}
  .lv-ring svg{width:80px;height:80px;transform:rotate(-90deg);}
  .lv-ring .ring-bg{fill:none;stroke:var(--line);stroke-width:7;}
  .lv-ring .ring-fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1);}
  .lv-ring .ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
  .lv-ring .ring-c b{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1;}
  .lv-ring .ring-c span{font-size:10px;color:var(--ink-faint);font-weight:600;}
  .lv-stats{flex:1;display:flex;flex-direction:column;gap:8px;}
  .lv-stat{display:flex;align-items:center;justify-content:space-between;font-size:13px;}
  .lv-stat span{color:var(--ink-soft);}
  .lv-stat b{font-family:var(--mono);font-weight:600;}
  .lv-stat b.pos{color:var(--accent-deep);} .lv-stat b.neg{color:var(--hi);}
  .lv-usein{width:62px;border:1px solid var(--line);border-radius:7px;background:var(--cell-bg);font-family:var(--mono);font-size:12.5px;font-weight:600;padding:4px 7px;outline:none;color:var(--ink);text-align:right;transition:all .15s;}
  .lv-usein:hover{border-color:var(--accent);} .lv-usein:focus{border-color:var(--accent);background:var(--paper);}
  .lv-usein.on{border-color:var(--accent);background:var(--accent-tint);color:var(--accent-deep);}
  .lv-cap{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;background:var(--cell-bg);border:1px solid var(--line-soft);border-radius:11px;padding:11px 15px;margin-bottom:16px;}
  .lv-cap svg{width:17px;height:17px;color:var(--accent);flex-shrink:0;}
  .lv-cap b{color:var(--accent-deep);font-weight:700;}
  /* ── 연차 규칙 설정 ── */
  .lv-rule{margin-bottom:16px;border:1px solid var(--line);border-radius:11px;background:var(--paper);overflow:hidden;}
  .lv-rule-tog{width:100%;display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink-soft);padding:12px 15px;}
  .lv-rule-tog svg{width:15px;height:15px;color:var(--accent);flex-shrink:0;}
  .lv-rule-sum{font-weight:500;font-size:12px;color:var(--ink-faint);}
  .lv-rule-arr{margin-left:auto;font-size:11px;color:var(--ink-faint);}
  .lv-rule-body{padding:4px 15px 14px;border-top:1px solid var(--line-soft);}
  .lv-rule-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0;font-size:12.5px;color:var(--ink-soft);}
  .lv-rule-row label{display:inline-flex;align-items:center;gap:5px;}
  .lv-rule-row input{width:52px;border:1px solid var(--line);border-radius:7px;background:var(--cell-bg);font-family:var(--mono);font-size:12.5px;font-weight:600;padding:5px 7px;outline:none;color:var(--ink);text-align:right;}
  .lv-rule-row input:focus{border-color:var(--accent);background:var(--paper);}
  .lv-rule-sep{font-weight:700;color:var(--ink-faint);padding-left:6px;}
  .lv-rule-prev{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding-top:11px;border-top:1px solid var(--line-soft);}
  .lv-rule-prevlbl{font-size:11px;font-weight:700;color:var(--ink-faint);letter-spacing:.02em;margin-right:3px;}
  .lv-rule-prev span:not(.lv-rule-prevlbl){font-size:11.5px;color:var(--ink-soft);background:var(--cell-bg);border:1px solid var(--line-soft);padding:3px 9px;border-radius:7px;}
  .lv-rule-prev b{color:var(--accent-deep);font-weight:700;}
  .lv-card-f{margin-top:13px;padding-top:11px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--ink-faint);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .lv-dd{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;}
  .lv-dd.over{color:#fff;background:var(--ink-faint);} .lv-dd.urgent{color:#fff;background:var(--hi);}
  .lv-dd.soon{color:var(--mid);background:var(--mid-bg);} .lv-dd.norm{color:var(--accent);background:var(--accent-soft);}
  .lv-other{border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:14px 17px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
  .lv-other-h{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em;margin-bottom:11px;}
  .lv-other-list{display:flex;flex-wrap:wrap;gap:9px;}
  .lv-other-i{display:flex;align-items:center;gap:8px;font-size:12.5px;border:1px solid var(--line-soft);background:var(--cell-bg);padding:7px 12px;border-radius:9px;}
  .lv-other-i b{font-family:var(--mono);font-weight:600;color:var(--ink);}
  .lv-break{border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:15px 17px;box-shadow:var(--shadow-sm);}
  .lv-break-h{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em;margin-bottom:12px;}
  .lv-break-h span{font-weight:500;color:var(--ink-faint);font-size:11px;}
  .lv-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
  .lv-tbl th{text-align:left;font-size:11px;font-weight:700;color:var(--ink-faint);letter-spacing:.02em;padding:0 8px 9px;border-bottom:1px solid var(--line);}
  .lv-tbl td{padding:9px 8px;border-bottom:1px solid var(--line-soft);color:var(--ink);}
  .lv-tbl tr:last-child td{border-bottom:none;}
  .lv-tbl tr.future td{color:var(--ink-faint);}
  .lv-tbl .r{text-align:right;}
  .lv-ovin{width:66px;border:1px solid var(--line);border-radius:7px;background:var(--cell-bg);font-family:var(--mono);font-size:12px;padding:5px 7px;outline:none;color:var(--ink);text-align:right;}
  .lv-ovin:focus{border-color:var(--accent);background:var(--paper);}
  .lv-note{font-size:11.5px;color:var(--ink-faint);line-height:1.6;margin-top:16px;padding:11px 14px;background:var(--cell-bg);border:1px solid var(--line-soft);border-radius:10px;}
  /* ── 인쇄 버튼 ── */
  .cal-actions{display:flex;align-items:center;gap:9px;}
  .cal-print{font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);padding:8px 13px;border-radius:9px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .cal-print:hover{border-color:var(--accent);color:var(--accent);}
  .cal-print svg{width:15px;height:15px;}
  .cal-share{font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 13px;border-radius:9px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 2px 7px rgba(var(--accent-rgb),.25);}
  .cal-share:hover{background:var(--accent-deep);border-color:var(--accent-deep);}
  .cal-share svg{width:15px;height:15px;}
  /* ── 캘린더 인쇄 / PDF (모바일 포함) ── */
  @media print{
    @page{size:A4 landscape;margin:8mm;}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
    body{background:#fff!important;}
    body *{visibility:hidden!important;}
    #main-panel,#main-panel *{visibility:visible!important;}
    #main-panel{position:absolute!important;left:0;top:0;width:100%!important;padding:0!important;margin:0!important;border:none!important;box-shadow:none!important;overflow:visible!important;}
    .cal-actions,.cal-head .nav,.scrim{display:none!important;}
    .cal-head{margin-bottom:8px!important;padding:0!important;border:none!important;}
    .cal-title .mo{font-size:20px!important;} .cal-title .yr{font-size:13px!important;}
    .weekdays{margin-bottom:4px!important;}
    .week{break-inside:avoid!important;page-break-inside:avoid!important;}
    .cell{min-height:88px!important;box-shadow:none!important;}
    .cell.muted{opacity:.5!important;}
    .bar{box-shadow:none!important;}
  }

  /* ══════ 시험 진행 관리(QC 트래커) 탭 — 원본 다크 테마를 #qc-view 안에 스코핑 ══════ */
#qc-view {
    --qc-bg:#232c3a;
    --qc-panel:#2b3548;
    --qc-panel-2:#333f55;
    --qc-border:#4a5872;
    --qc-text:#f2f4f8;
    --qc-text-dim:#b3bccd;
    --qc-accent:#4ecdc2;
    --qc-accent-dim:#3a6b66;
    --qc-ok:#43d68a;
    --qc-ok-dim:#1f4a35;
    --qc-type:#f0bb52;
    --qc-pending:#414f68;
  }
#qc-view * {box-sizing:border-box;}
#qc-view {margin:0;background:var(--qc-bg);color:var(--qc-text);font-family:'IBM Plex Sans KR', sans-serif;-webkit-font-smoothing:antialiased;border-radius:var(--r-sm);padding:16px;color-scheme:dark only;forced-color-adjust:none;}
#qc-view * {color-scheme:dark only;forced-color-adjust:none;}
#qc-view .wrap {max-width:1440px;margin:0 auto;padding:28px 20px 60px;}
#qc-view header {display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:18px;}
#qc-view .title-block {min-width:280px;}
#qc-view .qc-project-switch {display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
#qc-view .qc-project-switch select {min-width:160px;font-weight:600;}
#qc-view .meta-row {display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px;}
#qc-view .meta-input {background:transparent;border:none;border-bottom:1px dashed var(--qc-border);color:var(--qc-text) !important;font-family:inherit;outline:none;padding:3px 1px;}
#qc-view .meta-input::placeholder {color:#8894aa !important;opacity:1 !important;}
#qc-view .meta-input:focus {border-bottom-color:var(--qc-accent);}
#qc-view .meta-name {font-size:23px;font-weight:700;min-width:180px;}
#qc-view .title-block .sub {font-size:13px;color:var(--qc-text-dim);margin-top:2px;}
#qc-view .stat-row {display:flex;gap:16px;align-items:center;}
#qc-view .ring {position:relative;width:64px;height:64px;flex-shrink:0;}
#qc-view .ring svg {transform:rotate(-90deg);width:64px;height:64px;}
#qc-view .ring circle {fill:none;stroke-width:6;}
#qc-view .ring .bg {stroke:var(--qc-panel-2);}
#qc-view .ring .fg {stroke:var(--qc-accent);stroke-linecap:round;transition:stroke-dashoffset .3s;}
#qc-view .ring .pct {position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:13.5px;font-weight:600;}
#qc-view .stat-nums {font-family:'IBM Plex Mono';font-size:14px;color:var(--qc-text-dim);line-height:1.6;}
#qc-view .stat-nums b {color:var(--qc-text);font-weight:600;}
#qc-view .toolbar {display:flex;flex-wrap:wrap;gap:9px;align-items:center;background:var(--qc-panel);border:1px solid var(--qc-border);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
#qc-view .toolbar .grp {display:flex;gap:7px;align-items:center;padding-right:11px;border-right:1px solid var(--qc-border);}
#qc-view .toolbar .grp:last-child {border-right:none;padding-right:0;}
#qc-view input[type=text], #qc-view input[type=number] {background:var(--qc-panel-2) !important;border:1px solid var(--qc-border);color:var(--qc-text) !important;border-radius:6px;padding:8px 11px;font-family:inherit;font-size:14px;outline:none;}
#qc-view input[type=text]::placeholder, #qc-view input[type=number]::placeholder {color:#8894aa !important;opacity:1 !important;}
#qc-view input[type=text]:focus, #qc-view input[type=number]:focus {border-color:var(--qc-accent);}
#qc-view input[type=number] {width:68px;}
#qc-view select {background:var(--qc-panel-2) !important;border:1px solid var(--qc-border);color:var(--qc-text) !important;border-radius:6px;padding:8px 10px;font-family:inherit;font-size:14px;outline:none;}
#qc-view select option {background:var(--qc-panel-2);color:var(--qc-text);}
#qc-view button {background:var(--qc-panel-2);border:1px solid var(--qc-border);color:var(--qc-text);border-radius:6px;padding:8px 13px;font-family:inherit;font-size:13.5px;cursor:pointer;transition:background .15s, border-color .15s;}
#qc-view button:hover {background:#3a465c;border-color:#5a6b88;}
#qc-view button.primary {background:var(--qc-accent-dim);border-color:var(--qc-accent);color:#bdf3ee;}
#qc-view button.primary:hover {background:#2f6a63;}
#qc-view button.danger {color:#f0a493;}
#qc-view button.danger:hover {border-color:#c04b30;}
#qc-view button.tab {background:transparent;border-color:transparent;color:var(--qc-text-dim);}
#qc-view button.tab.active {background:var(--qc-panel-2);border-color:var(--qc-border);color:var(--qc-text);}
#qc-view .panel {display:none;margin-bottom:14px;background:var(--qc-panel);border:1px solid var(--qc-border);border-radius:10px;padding:14px;}
#qc-view .panel.open {display:block;}
#qc-view .panel textarea {width:100%;min-height:100px;background:var(--qc-panel-2) !important;border:1px solid var(--qc-border);color:var(--qc-text) !important;border-radius:6px;padding:10px;font-family:'IBM Plex Mono';font-size:13.5px;resize:vertical;outline:none;}
#qc-view .panel .hint {font-size:12.5px;color:var(--qc-text-dim);margin:0 0 9px;}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY='work-schedule-v1';

/* ════════════════ Supabase 연동 (팀 공유) ════════════════ */
const SUPABASE_URL='https://gitpmhmdrvrjwufeiwcb.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_9vWgYrVC4iSQRx-qPKwQyg_DpfZ31Pk';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let session=null, profile=null, profilesMap={}, pendingSignups=[];
let memoState={memo:'',dateMemos:{},memoAutoNum:false};
let leaveRequests=[];
let pendingRemoteSchedule=null, lastSelfSaveAt=0, lastSelfMemoSaveAt=0;
function isLeader(){return !!profile && (profile.role==='파트장'||profile.role==='개발자');}

let authMode='login';
async function initAuth(){
  const {data:{session:s}}=await sb.auth.getSession();
  session=s;
  if(session)await afterLogin(); else showLogin();
  sb.auth.onAuthStateChange((ev,s2)=>{
    if(ev==='SIGNED_IN'&&!profile){session=s2;afterLogin();}
    else if(ev==='SIGNED_OUT'){location.reload();}
  });
}
function setAuthMode(m){authMode=m;renderAuthScreen();}
function renderAuthScreen(){
  const el=document.getElementById('auth-modal');
  if(authMode==='pending'){
    el.innerHTML=`<div class="m-head"><div class="m-date">가입 승인 대기 중</div></div>
      <div class="m-body"><p style="font-size:13.5px;line-height:1.7;color:var(--ink-soft);">
        <b style="color:var(--ink)">${esc(profile?profile.name:'')}</b>님 계정이 등록됐어요.<br>
        파트장이 승인하면 자동으로 접속할 수 있어요.<br>승인 전까지는 화면을 사용할 수 없어요.
      </p></div>
      <div class="m-foot"><div class="left"></div><button class="ghost" onclick="doLogout()">로그아웃</button></div>`;
    return;
  }
  if(authMode==='signup'){
    el.innerHTML=`<div class="m-head"><div class="m-date">회원가입</div></div>
      <div class="m-body">
        <div class="field-lbl">이름</div>
        <input type="text" id="su-name" class="m-in" placeholder="홍길동" style="width:100%;margin-bottom:10px">
        <div class="field-lbl">이메일</div>
        <input type="email" id="su-email" class="m-in" placeholder="you@company.com" style="width:100%;margin-bottom:10px">
        <div class="field-lbl">비밀번호</div>
        <input type="password" id="su-pw" class="m-in" placeholder="6자 이상" style="width:100%;margin-bottom:10px">
        <div id="signup-err" style="font-size:12.5px;margin-top:2px;min-height:16px;"></div>
      </div>
      <div class="m-foot"><div class="left"><button class="ghost" onclick="setAuthMode('login')">← 로그인으로</button></div><button class="done-btn" onclick="doSignup()">가입 신청</button></div>`;
    return;
  }
  el.innerHTML=`<div class="m-head"><div class="m-date">로그인</div></div>
    <div class="m-body">
      <div class="field-lbl">이메일</div>
      <input type="email" id="login-email" class="m-in" placeholder="you@company.com" style="width:100%;margin-bottom:10px" onkeydown="if(event.key==='Enter')doLogin()">
      <div class="field-lbl">비밀번호</div>
      <input type="password" id="login-pw" class="m-in" placeholder="비밀번호" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()">
      <div id="login-err" style="color:#d2543a;font-size:12.5px;margin-top:10px;min-height:16px;"></div>
    </div>
    <div class="m-foot"><div class="left"><button class="ghost" onclick="setAuthMode('signup')">회원가입</button></div><button class="done-btn" onclick="doLogin()">로그인</button></div>`;
}
function showLogin(){setAuthMode('login');document.getElementById('auth-scrim').classList.add('show');document.getElementById('app').style.visibility='hidden';}
function showPending(){setAuthMode('pending');document.getElementById('auth-scrim').classList.add('show');document.getElementById('app').style.visibility='hidden';}
async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pw=document.getElementById('login-pw').value;
  const errEl=document.getElementById('login-err');errEl.textContent='';
  if(!email||!pw){errEl.textContent='이메일/비밀번호를 입력해주세요.';return;}
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){errEl.textContent='로그인 실패: 이메일 또는 비밀번호를 확인해주세요.';return;}
  session=data.session;await afterLogin();
}
async function doSignup(){
  const name=document.getElementById('su-name').value.trim();
  const email=document.getElementById('su-email').value.trim();
  const pw=document.getElementById('su-pw').value;
  const errEl=document.getElementById('signup-err');errEl.style.color='#d2543a';errEl.textContent='';
  if(!name||!email||!pw){errEl.textContent='이름/이메일/비밀번호를 모두 입력해주세요.';return;}
  if(pw.length<6){errEl.textContent='비밀번호는 6자 이상으로 해주세요.';return;}
  const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{name}}});
  if(error){errEl.textContent='가입 실패: '+(error.message||'다시 시도해주세요.');return;}
  if(data.session){session=data.session;await afterLogin();}
  else{
    errEl.style.color='var(--accent)';
    errEl.textContent='이메일로 확인 링크를 보냈어요. 링크를 눌러 확인한 뒤 로그인해주세요.';
    setTimeout(()=>setAuthMode('login'),2200);
  }
}
function doLogout(){if(confirm('로그아웃할까요?'))sb.auth.signOut();}
function roleTier(){if(!profile)return 'member';if(profile.role==='사무용품')return 'supplies';return isLeader()?'leader':'member';}
function isSupplyAdmin(){return !!profile && (profile.role==='파트장'||profile.role==='개발자'||profile.role==='사무용품');}
async function afterLogin(){
  const authUid=session.user.id;
  let {data:p,error}=await sb.from('profiles').select('*').eq('id',authUid).maybeSingle();
  if(!p){
    const name=(session.user.user_metadata&&session.user.user_metadata.name)||session.user.email.split('@')[0];
    const ins=await sb.from('profiles').insert({id:authUid,name,email:session.user.email,role:'팀원',approved:false}).select().single();
    if(ins.error){
      setAuthMode('login');
      const e2=document.getElementById('login-err');if(e2)e2.textContent='계정 등록 중 오류가 발생했어요. 파트장에게 문의해주세요.';
      await sb.auth.signOut();return;
    }
    p=ins.data;
  }
  profile=p;
  if(!profile.approved){showPending();return;}
  document.getElementById('auth-scrim').classList.remove('show');
  document.getElementById('app').style.visibility='';
  const tier=roleTier();
  document.body.setAttribute('data-role',tier);
  document.getElementById('user-badge').textContent=`${profile.name} · ${profile.role}`;
  if(tier==='supplies')viewMode='supplies';
  await Promise.all([loadProfilesMap(),loadAll(),loadLeaveRequests(),loadPendingSignups(),qcLoadData(),supplyLoadState()]);
  renderAll();
  subscribeRealtime();
}
async function loadProfilesMap(){
  const {data:rows}=await sb.from('profiles').select('id,name,role');
  profilesMap={};(rows||[]).forEach(r=>profilesMap[r.id]=r);
}
async function loadAll(){
  const [{data:sd,error:e1},{data:md,error:e2},{data:pm}]=await Promise.all([
    sb.from('schedule_data').select('payload').eq('id','main').single(),
    sb.from('memo_data').select('payload').eq('id','main').single(),
    sb.from('personal_memos').select('content').eq('id',profile.id).maybeSingle(),
  ]);
  if(e1||e2){alert('데이터를 불러오지 못했어요. SUPABASE_SETUP.md의 테이블 설정을 확인해주세요.');console.error(e1,e2);}
  data=(sd&&sd.payload&&Object.keys(sd.payload).length)?sd.payload:{version:4,projects:[],templates:[],events:[],notes:[]};
  migrate();
  memoState=(md&&md.payload&&Object.keys(md.payload).length)?md.payload:{memo:'',dateMemos:{},memoAutoNum:false};
  if(!memoState.dateMemos)memoState.dateMemos={};
  autoNum=!!memoState.memoAutoNum;
  personalMemo=(pm&&pm.content)||'';
  loadTheme();applyTheme();
  renderAll();
  tick();if(!window.__tickStarted){window.__tickStarted=true;setInterval(tick,30000);}
}
function subscribeRealtime(){
  sb.channel('schedule_data_ch').on('postgres_changes',{event:'UPDATE',schema:'public',table:'schedule_data',filter:'id=eq.main'},payload=>{
    if(Date.now()-lastSelfSaveAt<2500)return;
    const incoming=payload.new.payload;
    if(openId){pendingRemoteSchedule=incoming;return;}
    data=incoming;migrate();renderAll();
  }).subscribe();
  sb.channel('memo_data_ch').on('postgres_changes',{event:'UPDATE',schema:'public',table:'memo_data',filter:'id=eq.main'},payload=>{
    if(Date.now()-lastSelfMemoSaveAt<2500)return;
    memoState=payload.new.payload||{memo:'',dateMemos:{},memoAutoNum:false};
    if(!memoState.dateMemos)memoState.dateMemos={};
    autoNum=!!memoState.memoAutoNum;
    if(viewMode==='note')renderNotesView();
  }).subscribe();
  sb.channel('leave_requests_ch').on('postgres_changes',{event:'*',schema:'public',table:'leave_requests'},async()=>{
    await loadLeaveRequests();
    renderLeaveBellModal();
  }).subscribe();
  if(isLeader()){
    sb.channel('profiles_ch').on('postgres_changes',{event:'*',schema:'public',table:'profiles'},async()=>{
      await loadPendingSignups();
      renderSignupBellModal();
    }).subscribe();
  }
  sb.channel('qc_tracker_ch').on('postgres_changes',{event:'*',schema:'public',table:'qc_tracker_data'},payload=>{
    if(Date.now()-lastSelfQcSaveAt<2000)return;
    const rowId=(payload.new&&payload.new.id)||(payload.old&&payload.old.id);
    if(payload.eventType==='DELETE'){
      qcProjects=qcProjects.filter(x=>x.id!==rowId);
      if(rowId===qcActiveId&&qcProjects.length)qcSwitchProject(qcProjects[0].id,true);
    }else{
      const p=payload.new.payload||{};
      const name=(p.project&&p.project.name)||'(이름 없음)';
      const existing=qcProjects.find(x=>x.id===rowId);
      if(existing)existing.name=name; else qcProjects.push({id:rowId,name});
      if(rowId===qcActiveId){qcApplyPayload(p);if(viewMode==='qc')qcRender();}
    }
    if(viewMode==='qc')qcRenderProjectSelect();
  }).subscribe();
  sb.channel('supply_items_ch').on('postgres_changes',{event:'*',schema:'public',table:'supply_items'},async()=>{
    if(Date.now()-lastSelfSupplyChangeAt<2000)return;
    if(viewMode==='supplies'){await supplyLoadState();supplyRenderList();}
  }).subscribe();
}
async function loadLeaveRequests(){
  const {data:rows}=await sb.from('leave_requests').select('*').order('created_at',{ascending:false});
  leaveRequests=rows||[];
  refreshLeaveRequestBadge();
}
function refreshLeaveRequestBadge(){
  const badge=document.getElementById('leave-badge');if(!badge)return;
  const n=leaveRequests.filter(r=>r.status==='pending').length;
  badge.style.display=n>0?'inline-flex':'none';badge.textContent=n;
}
async function loadPendingSignups(){
  if(!isLeader())return;
  const {data:rows}=await sb.from('profiles').select('*').eq('approved',false).order('created_at',{ascending:true});
  pendingSignups=rows||[];
  refreshSignupBadge();
}
function refreshSignupBadge(){
  const badge=document.getElementById('signup-badge');if(!badge)return;
  const n=pendingSignups.length;
  badge.style.display=n>0?'inline-flex':'none';badge.textContent=n;
}
function openSignupBell(){renderSignupBellModal();document.getElementById('signupbell-scrim').classList.add('show');}
function closeSignupBell(){document.getElementById('signupbell-scrim').classList.remove('show');}
function renderSignupBellModal(){
  const el=document.getElementById('signupbell-modal');if(!el)return;
  const rows=pendingSignups.map(p=>`<div class="lr-row">
    <div class="lr-info"><b>${esc(p.name)}</b><div class="lr-memo">${esc(p.email||'')}</div></div>
    <div class="lr-actions">
      <select class="m-sel" id="su-role-${p.id}" style="padding:6px 8px;font-size:12px;">
        <option value="팀원" selected>팀원</option>
        <option value="파트장">파트장</option>
        <option value="개발자">개발자</option>
        <option value="사무용품">사무용품 전용</option>
      </select>
      <button class="done-btn" onclick="decideSignup('${p.id}',true)">승인</button>
      <button class="ghost" onclick="decideSignup('${p.id}',false)">거절</button>
    </div>
  </div>`).join('');
  el.innerHTML=`<div class="m-head"><div class="m-date">👤 가입 승인</div></div>

    <div class="m-foot"><div class="left"></div><button class="done-btn" onclick="closeSignupBell()">닫기</button></div>`;

async function decideSignup(id,approve){
  if(approve){
    const sel=document.getElementById('su-role-'+id);
    const role=sel?sel.value:'팀원';
    const {error}=await sb.from('profiles').update({approved:true,role}).eq('id',id);
    if(error){alert('처리 중 오류가 발생했어요.');console.error(error);return;}
  }else{
    const {error}=await sb.from('profiles').delete().eq('id',id);
    if(error){alert('처리 중 오류가 발생했어요.');console.error(error);return;}
  }
  await loadPendingSignups();
  await loadProfilesMap();
  renderSignupBellModal();
}

const THEME_KEY='work-schedule-theme';
const MODES=[
  {id:'light',lbl:'라이트 모드'},

let theme={mode:'light',accent:'teal'};
function loadTheme(){try{const v=localStorage.getItem(THEME_KEY);if(v){const p=JSON.parse(v);if(p&&p.mode)theme.mode=p.mode;if(p&&p.accent)theme.accent=p.accent;}}catch(e){}}
function saveTheme(){try{localStorage.setItem(THEME_KEY,JSON.stringify(theme));}catch(e){}}
function effectiveMode(){if(theme.mode==='system'){return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}return theme.mode;}
function applyTheme(){const root=document.documentElement;root.setAttribute('data-theme',effectiveMode());root.setAttribute('data-accent',theme.accent);}
function setMode(m){theme.mode=m;saveTheme();applyTheme();renderSettings();}
function setAccent(a){theme.accent=a;saveTheme();applyTheme();renderSettings();}
function toggleSettings(ev){if(ev)ev.stopPropagation();const p=document.getElementById('settings-pop');if(p.classList.contains('show'))closeSettings();else{renderSettings();p.classList.add('show');}}
function closeSettings(){document.getElementById('settings-pop').classList.remove('show');}
function renderSettings(){
  const modeIc={light:'<circle cx="12" cy="12" r="4.5"/><path d="M12 3v1.5M12 19.5V21M5 5l1 1M18 18l1 1M3 12h1.5M19.5 12H21M5 19l1-1M18 6l1-1"/>',
    dark:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
    system:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'};
  document.getElementById('mode-opts').innerHTML=MODES.map(m=>`
    <div class="mode-opt ${theme.mode===m.id?'on':''}" onclick="setMode('${m.id}')">
      <span class="radio"></span>
      <svg class="mo-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${modeIc[m.id]}</svg>
      ${m.lbl}</div>`).join('');
  document.getElementById('accent-grid').innerHTML=ACCENTS.map(a=>`
    <div class="acc-sw ${theme.accent===a.id?'on':''}" style="background:${a.hex}" onclick="setAccent('${a.id}')" title="${a.id}"></div>`).join('');
}

function migrate(){
  if(!data.events)data.events=[];
  if(!data.projects||!data.projects.length)data.projects=JSON.parse(JSON.stringify(SEED_PROJECTS));
  if(!data.templates)data.templates=JSON.parse(JSON.stringify(SEED_TEMPLATES));
  data.events.forEach(e=>{
    if(!e.projectId){const p=data.projects.find(p=>p.color===e.color);e.projectId=p?p.id:data.projects[0].id;}
    if(!e.endDate)e.endDate=e.date;
    (e.todos||[]).forEach(t=>{if(!t.status)t.status=t.done?'done':'todo';});
  });
  // 프로젝트 색상을 hex로 정규화 (구버전 팔레트 id → hex). 이벤트 매핑 이후에 실행.
  data.projects.forEach(p=>{p.color=colorToHex(p.color);if(typeof p.archived!=='boolean')p.archived=false;});
  // 휴가 설정 기본값
  if(!data.leave||typeof data.leave!=='object')data.leave={hireDate:'',fiscalReset:true,overrides:{}};
  if(!data.leave.overrides||typeof data.leave.overrides!=='object')data.leave.overrides={};
  if(data.leave.fiscalReset===undefined)data.leave.fiscalReset=true;
  if(!data.leave.roundMode)data.leave.roundMode='ceil';
  if(!data.leave.usedOverride||typeof data.leave.usedOverride!=='object')data.leave.usedOverride={};
  if(!data.leave.rule||typeof data.leave.rule!=='object')data.leave.rule={};
  {const R=data.leave.rule;if(R.base==null)R.base=15;if(R.bonusDays==null)R.bonusDays=1;if(R.bonusEvery==null)R.bonusEvery=2;if(R.bonusStart==null)R.bonusStart=3;if(R.max==null)R.max=25;if(R.monthlyMax==null)R.monthlyMax=11;}
  data.version=12;
}

function proj(id){return data.projects.find(p=>p.id===id);}
function colorToHex(c){if(typeof c==='string'&&c[0]==='#')return c;const f=PALETTE.find(x=>x.id===c);return f?f.hex:PALETTE[0].hex;}

function dueOf(e){return e.endDate||e.date;}
function isMulti(e){return e.endDate&&e.endDate!==e.date;}
function dday(e){
  const s=dayNum(e.date), en=dayNum(dueOf(e));
  if(s<=TODAY_NUM&&TODAY_NUM<=en&&s!==en)return {txt:'진행중',cls:'run'};
  const diff=en-TODAY_NUM;
  if(diff<0)return {txt:`D+${-diff}`,cls:'over'};
  if(diff===0)return {txt:'D-DAY',cls:'urgent'};
  if(diff<=2)return {txt:`D-${diff}`,cls:'urgent'};
  if(diff<=7)return {txt:`D-${diff}`,cls:'soon'};
  return {txt:`D-${diff}`,cls:'norm'};
}

  if(data.events.some(e=>!e.projectId)){const on=projSel!==null&&projSel.includes('__none');c+=`<div class="chip projchip ${on?'on':''}" onclick="toggleProj('__none')">${on?'<span class="pcheck">✓</span>':''}<span class="dot" style="background:#999"></span>프로젝트 없음</div>`;}

function setAllProj(){projSel=null;renderAll();}
function toggleProj(id){
  const all=projAllIds();
  let sel=projSel===null?[]:projSel.slice();
  const i=sel.indexOf(id);
  if(i>=0)sel.splice(i,1); else sel.push(id);
  projSel=(sel.length===0||all.every(x=>sel.includes(x)))?null:sel;
  renderAll();
}

/* ════════════════ 휴가(연차) 계산 ════════════════
   모델: 입사 1년 미만 = 입사일 기준 월차(개근 1일/월, 최대 11일)
        그 이후 = 회계연도(1/1) 기준. 입사 다음해 1/1 비례연차(15×재직일/365),
        그 다음해부터 15일 + 근속 가산(3년차 16, 2년마다 +1, 최대 25). */
let leaveYear=new Date().getFullYear();
let leaveRuleOpen=false;
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addMonths(d,n){const x=new Date(d.getFullYear(),d.getMonth()+n,d.getDate());if(x.getDate()!==d.getDate())x.setDate(0);return x;}
function daysInclusive(a,b){return Math.floor((b-a)/86400000)+1;}
function jan1(y){return new Date(y,0,1);}
function dec31(y){return new Date(y,11,31);}
function dnum(d){return Math.floor(d.getTime()/86400000);}
function fmtD2(d){return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;}
function round1(n){return Math.round(n*10)/10;}
/* 0.25 단위 그대로 표시 (8.75를 8.7로 뭉개지 않음), 정수는 소수점 생략 */
function snap2(n){return Math.round(n*100)/100;}
function fmtDays(n){const v=snap2(n);if(v===0)return '0';let s=v.toFixed(2).replace(/\.?0+$/,'');return s||'0';}
/* 발생(부여) 일수는 정수 단위로 정리. 회사 규정에 맞춰 올림/반올림/내림 선택. */
function roundGrant(n){const m=(data.leave&&data.leave.roundMode)||'ceil';if(m==='floor')return Math.floor(n);if(m==='round')return Math.round(n);return Math.ceil(n);}
/* 시간연차 사용은 0.25일(=2시간) 단위로 스냅 */
function hoursToDays(h){return Math.round((h/DAILY_HOURS)*4)/4;}
function spanWeekdays(e){let a=parseD(e.date),b=parseD(e.endDate||e.date),n=0;for(let t=new Date(a);t<=b;t.setDate(t.getDate()+1)){const w=t.getDay();if(w!==0&&w!==6)n++;}return n||1;}

/* 휴가 종류·차감일수 판정. e.leave 명시값 우선, 없으면 '휴가' 프로젝트 일정은 제목으로 추론. */
function inferLeave(e){
  const t=`${e.title||''} ${e.memo||''}`;
  if(/반반차/.test(t))return {kind:'half',days:0.25};
  if(/반차|반일|오전\s*반|오후\s*반/.test(t))return {kind:'half',days:0.5};
  const range=t.match(/(\d{1,2}):(\d{2})\s*[-~]\s*(\d{1,2}):(\d{2})/);
  const hm=t.match(/(?:^|[^:\d])(\d+(?:\.\d+)?)\s*시간/);
  if(/시간\s*연차|시간\s*휴가/.test(t)||hm||(range&&/시간/.test(t))){
    let hours=0;
    if(range)hours=((+range[3])+(+range[4])/60)-((+range[1])+(+range[2])/60);
    else if(hm)hours=+hm[1];
    if(hours<=0)hours=1;
    return {kind:'hour',hours:round1(hours)};
  }
  if(/경조|결혼|혼인|조의|부고|장례|상\(|발인|출산|배우자/.test(t))return {kind:'event'};
  if(/보건|생리/.test(t))return {kind:'health'};
  return {kind:'annual'};
}
function leaveOf(e){
  let lv=e.leave;
  if(!lv){const p=proj(e.projectId);if(!p||!/휴가/.test(p.name))return null;lv=inferLeave(e);}
  if(!lv||!lv.kind)return null;
  const k=LK[lv.kind]||LK.annual;
  let days;
  if(lv.kind==='hour')days=hoursToDays(lv.hours||0);
  else if(typeof lv.days==='number')days=lv.days;
  else days=k.def*(k.id==='annual'?spanWeekdays(e):1);
  return {kind:lv.kind,lbl:k.lbl,bucket:k.bucket,days:Math.round(days*100)/100,hours:lv.hours};
}

/* 발생 내역(grants) 생성 */
function leaveRule(){return data.leave.rule||{base:15,bonusDays:1,bonusEvery:2,bonusStart:3,max:25,monthlyMax:11};}
function grantForYear(svc){const r=leaveRule();let t=r.base;if(svc>=r.bonusStart)t+=r.bonusDays*(Math.floor((svc-r.bonusStart)/r.bonusEvery)+1);return Math.min(t,r.max);}
function leaveGrants(H){
  const r=leaveRule(),hy=H.getFullYear(),grants=[],anniv1=addMonths(H,12);
  const mmax=r.monthlyMax||11;
  for(let k=1;k<=mmax;k++){const g=addMonths(H,k);if(g>=anniv1)break;grants.push({kind:'monthly',date:g,days:1,expire:anniv1,label:`입사 ${k}개월 차 월차`});}
  const base=daysInclusive(H,dec31(hy));
  const rawProp=r.base*base/365;
  grants.push({kind:'prorated',year:hy+1,date:jan1(hy+1),days:roundGrant(rawProp),raw:round1(rawProp),expire:dec31(hy+1),label:`비례연차 (${r.base} × ${base} ÷ 365 = ${round1(rawProp)})`});
  // 가산이 보이도록 충분히 미래까지 펼침
  const horizon=Math.max(leaveYear+1,new Date().getFullYear()+1,hy+r.bonusStart+r.bonusEvery+1);
  for(let Y=hy+2;Y<=horizon;Y++){const svc=Y-hy;const total=grantForYear(svc);const add=total-r.base;grants.push({kind:'regular',year:Y,date:jan1(Y),days:total,expire:dec31(Y),label:`정기연차${add>0?` (${r.base} + 가산 ${add})`:''}`});}
  // 수동 override 적용
  return grants.map(g=>{if(g.year!=null){const ov=data.leave.overrides[g.year];if(ov!=null&&ov!=='')return {...g,days:+ov,overridden:true};}return g;});
}
function rulePreview(){const r=leaveRule(),out=[];let y=1;while(y<=45){const v=grantForYear(y);let end=y;while(end<45&&grantForYear(end+1)===v)end++;out.push({from:y,to:(v>=r.max?null:end),v});if(v>=r.max)break;y=end+1;}return out;}
function sumLeave(evs,pred){return snap2(evs.filter(pred).reduce((s,x)=>s+x.lv.days,0));}
function leaveStatus(vy){
  const hs=data.leave.hireDate;if(!hs)return null;
  const H=parseD(hs),hy=H.getFullYear(),anniv1=addMonths(H,12);
  const today=new Date();today.setHours(0,0,0,0);
  const grants=leaveGrants(H);
  const evs=data.events.map(e=>({e,lv:leaveOf(e)})).filter(x=>x.lv);
  const monthlyAll=grants.filter(g=>g.kind==='monthly');
  const monthlyTotal=monthlyAll.length;
  const monthlyAccrued=monthlyAll.filter(g=>dnum(g.date)<=dnum(today)).length;
  const monthlyExpired=dnum(today)>=dnum(anniv1);
  const autoUsedMonthly=sumLeave(evs,x=>{const d=parseD(x.e.date);return x.lv.bucket==='annual'&&dnum(d)>=dnum(H)&&dnum(d)<dnum(anniv1);});
  const fg=grants.find(g=>(g.kind==='prorated'||g.kind==='regular')&&g.year===vy);
  const fiscalDays=fg?fg.days:0;
  const autoUsedFiscal=sumLeave(evs,x=>{const d=parseD(x.e.date);return x.lv.bucket==='annual'&&d.getFullYear()===vy&&dnum(d)>=dnum(anniv1);});
  // 사용일수 수동 입력 우선 (캘린더 자동집계는 기본값)
  const uo=data.leave.usedOverride||{};
  const mOv=uo['monthly'], fOv=uo[vy];
  const usedMonthly=(mOv!=null&&mOv!=='')?+mOv:autoUsedMonthly;
  const usedFiscal=(fOv!=null&&fOv!=='')?+fOv:autoUsedFiscal;
  const usedMonthlyManual=(mOv!=null&&mOv!==''), usedFiscalManual=(fOv!=null&&fOv!=='');
  const other={};
  evs.forEach(x=>{if(x.lv.bucket==='other'&&parseD(x.e.date).getFullYear()===vy)other[x.lv.kind]=snap2((other[x.lv.kind]||0)+x.lv.days);});
  // 다음 월차 적립일
  let nextMonthly=null;
  if(!monthlyExpired&&monthlyAccrued<monthlyTotal){const g=monthlyAll[monthlyAccrued];if(g)nextMonthly=g.date;}
  return {H,hy,anniv1,today,grants,fg,fiscalDays,usedFiscal,autoUsedFiscal,usedFiscalManual,monthlyTotal,monthlyAccrued,monthlyExpired,usedMonthly,autoUsedMonthly,usedMonthlyManual,nextMonthly,other};
}

function ddayTo(target,today){const diff=dnum(target)-dnum(today);if(diff<0)return {txt:'만료',cls:'over'};if(diff===0)return {txt:'D-DAY',cls:'urgent'};return {txt:`D-${diff}`,cls:diff<=14?'soon':'norm'};}
function leaveRing(used,total){
  const pct=total>0?Math.max(0,Math.min(100,Math.round(used/total*100))):0;
  const left=fmtDays(total-used);
  const C=2*Math.PI*34,off=C*(1-pct/100);
  return `<div class="lv-ring"><svg viewBox="0 0 80 80"><circle class="ring-bg" cx="40" cy="40" r="34"/><circle class="ring-fg" cx="40" cy="40" r="34" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><div class="ring-c"><b>${left}</b><span>잔여</span></div></div>`;
}
function leaveKindLbl(k){const f=(typeof LEAVE_KINDS!=='undefined'?LEAVE_KINDS:[]).find(x=>x.id===k);return f?f.lbl:k;}

  return `<div class="lv-note lr-pending"><div class="lr-head">🔔 대기 중인 휴가 신청 (${pend.length})</div>${rows}</div>`;
}
async function decideLeaveRequest(id,approve){
  const req=leaveRequests.find(r=>r.id===id);if(!req)return;

    const lv=req.kind==='hour'?{kind:'hour',hours:req.hours||0}:{kind:req.kind,days:req.days!=null?req.days:(LK[req.kind]||LK.annual).def};
    data.events.push({id:uid(),title:`${name} 휴가`,date:req.start_date,endDate:req.end_date,memo:req.memo||'',projectId:p.id,todos:[],leave:lv});

  await loadLeaveRequests();
  renderLeaveBellModal();
  if(approve)refreshBg();
}
